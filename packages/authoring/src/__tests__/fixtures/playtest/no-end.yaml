# Fixture: playtest-no-end. Players are prompted every round, but the loop's end condition is never true.
metadata:
  name: No End
  playerCount:
    min: 2
    max: 2

state:
  game:
    properties:
      - id: finished
        type:
          kind: boolean
        default: false
        description: Never set, so the loop never ends.
  player:
    properties:
      - id: score
        type:
          kind: number
          min: 0
          max: 100
        default: 0
        description: Points scored.

actions:
  actions:
    - id: gainPoints
      label: Gain points
      description: Score a chosen number of points.
      steps:
        - input: amount
          label: Points
          type:
            kind: number
            min: 1
            max: 3
        - effect: set-state
          path: player.property.score
          value:
            delta: 1

flow:
  root:
    kind: game
    winConditions:
      - rule: ranking
        property: player.property.score
        order: highest
    children:
      - kind: loop
        endCondition: "game.property.finished == true"
        children:
          - kind: turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: action
              ref: gainPoints
