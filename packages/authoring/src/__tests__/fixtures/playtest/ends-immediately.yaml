# Fixture: playtest-ends-immediately. Setup eliminates every player, so no turn ever starts.
metadata:
  name: Ends Immediately
  playerCount:
    min: 2
    max: 2

state:
  player:
    properties:
      - id: score
        type:
          kind: number
          min: 0
          max: 100
        default: 0
        description: Points scored.

actions:
  actions:
    - id: gainPoint
      label: Gain a point
      description: Score one point.
      steps:
        - effect: set-state
          path: player.property.score
          value:
            delta: 1

flow:
  root:
    kind: game
    hooks:
      onEnter:
        - effect: set-state
          path: player.property.eliminated
          value: true
          target: all
    winConditions:
      - rule: ranking
        property: player.property.score
        order: highest
    children:
      - kind: loop
        count: 1
        children:
          - kind: turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: action
              ref: gainPoint
