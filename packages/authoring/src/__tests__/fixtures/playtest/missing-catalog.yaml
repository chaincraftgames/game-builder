# Fixture: missing-catalog. A gamepiece type is declared but no catalog creates pieces.
metadata:
  name: Missing Catalog
  playerCount:
    min: 2
    max: 2

state:
  player:
    properties:
      - id: score
        type:
          kind: number
          min: 0
          max: 100
        default: 0
        description: Points scored.

gamepieceTypes:
  types:
    - id: token
      category: token
      description: A token.

actions:
  actions:
    - id: gainPoint
      label: Gain a point
      description: Score one point.
      steps:
        - effect: set-state
          path: player.property.score
          value:
            delta: 1

flow:
  root:
    kind: game
    winConditions:
      - rule: ranking
        property: player.property.score
        order: highest
    children:
      - kind: loop
        count: 1
        children:
          - kind: turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: action
              ref: gainPoint
