# ---------------------------------------------------------------------------
# Spades (partnership, one hand). Authored by an AI from a plain-language
# brief.
#
# Four players in partnerships (seats 1 and 3 against seats 2 and 4), one
# standard 52-card deck, 13 cards each, spades always trump, aces high. One
# hand is the whole game.
#
# Bidding: each player bids once, starting with seat 2. A bid of 0 is Nil.
# Play is 13 tricks. A player must follow suit if able. Spades cannot be led
# until a spade has been played, unless the leader holds only spades. The
# highest spade wins the trick, otherwise the highest card of the led suit.
#
# Scoring per partnership: the bid is the sum of the partners' bids. Taking
# at least the bid scores 10 times the bid plus one point per overtrick,
# otherwise minus 10 times the bid. Each Nil bidder scores +100 for taking no
# tricks, otherwise -100; a Nil bidder's tricks still count toward the
# partnership. The higher partnership score wins, equal scores have no
# winner.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - Seats are found by a setup turn because expressions cannot name a seat
#    directly.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: seatSetup
      label: Take seat
      description: Automatic setup step run once per player in seat order; records partnership and the player to the dealer's left.
      steps:
        - effect: set-state
          path: game.property.seatNo
          value:
            delta: 1
        - effect: set-state
          path: player.property.team
          value:
            expr: if(game.property.seatNo == 1 or game.property.seatNo == 3, 1, 2)
        - effect: set-state
          path: game.property.leader
          value:
            expr: if(game.property.seatNo == 2, actor.id, game.property.leader)
    - id: placeBid
      label: Bid
      description: Bid the number of tricks you expect to take, 0 to 13. A bid of 0 is Nil.
      steps:
        - input: tricksBid
          label: Tricks to bid (0 = Nil)
          type:
            kind: number
            min: 0
            max: 13
            integer: true
        - effect: set-state
          path: player.property.bid
          value:
            param: tricksBid
    - id: playCard
      label: Play a card
      description: Play a card. You must follow the led suit if you can. Spades may not be led until a spade has been played, unless you hold only spades.
      steps:
        - input: card
          label: Choose a card to play
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            fromPlayer: actor
            filter: (game.property.ledSuit == "" and (piece.property.suit != "spades" or game.property.spadesBroken or all(actor.inventory.hand, piece.property.suit == "spades"))) or (game.property.ledSuit != "" and (piece.property.suit == game.property.ledSuit or count(actor.inventory.hand, piece.property.suit == game.property.ledSuit) == 0))
        - effect: set-state
          source:
            param: card
          path: game.property.ledSuit
          value:
            expr: if(game.property.ledSuit == "", source.property.suit, game.property.ledSuit)
        - effect: set-state
          source:
            param: card
          path: game.property.spadesBroken
          value:
            expr: if(source.property.suit == "spades", true, game.property.spadesBroken)
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: card
          property: trickRank
          value:
            expr: target.property.rank + if(target.property.suit == "spades", 100, if(target.property.suit == game.property.ledSuit, 50, 0))
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: table
