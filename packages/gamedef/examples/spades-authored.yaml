effects:
  effects:
    - id: fillDeck
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: deck
    - id: shuffleDeck
      effect: shuffle
      inventory: deck
    - id: dealCards
      effect: distribute
      from:
        inventory: deck
        select: top
      to:
        inventory: hand
      count: 13
    - id: awardTrick
      effect: set-state
      path: player.property.tricks
      value:
        delta: 1
      target:
        stateRef: game.property.roundWinner
    - id: winnerLeads
      effect: set-state
      path: game.property.leader
      value:
        var: game.property.roundWinner
    - id: clearTable
      effect: move
      from:
        inventory: table
        select: all
        ofType: card
      to:
        inventory: discard
    - id: resetLedSuit
      effect: set-state
      path: game.property.ledSuit
      value: ''
    - id: resetRoundWinner
      effect: set-state
      path: game.property.roundWinner
      value: ''
    - id: sumTeam1Bid
      effect: set-state
      path: game.property.team1Bid
      value:
        expr: sum(players, player.property.bid, player.property.team == 1)
    - id: sumTeam2Bid
      effect: set-state
      path: game.property.team2Bid
      value:
        expr: sum(players, player.property.bid, player.property.team == 2)
    - id: sumTeam1Tricks
      effect: set-state
      path: game.property.team1Tricks
      value:
        expr: sum(players, player.property.tricks, player.property.team == 1)
    - id: sumTeam2Tricks
      effect: set-state
      path: game.property.team2Tricks
      value:
        expr: sum(players, player.property.tricks, player.property.team == 2)
    - id: scoreTeam1Nil
      effect: set-state
      path: game.property.team1Nil
      value:
        expr: 100 * count(players, player.property.team == 1 and player.property.bid == 0 and player.property.tricks == 0) - 100 * count(players, player.property.team == 1 and player.property.bid == 0 and player.property.tricks > 0)
    - id: scoreTeam2Nil
      effect: set-state
      path: game.property.team2Nil
      value:
        expr: 100 * count(players, player.property.team == 2 and player.property.bid == 0 and player.property.tricks == 0) - 100 * count(players, player.property.team == 2 and player.property.bid == 0 and player.property.tricks > 0)
    - id: scoreTeam1
      effect: set-state
      path: game.property.team1Score
      value:
        expr: if(game.property.team1Tricks >= game.property.team1Bid, 10 * game.property.team1Bid + game.property.team1Tricks - game.property.team1Bid, 0 - 10 * game.property.team1Bid) + game.property.team1Nil
    - id: scoreTeam2
      effect: set-state
      path: game.property.team2Score
      value:
        expr: if(game.property.team2Tricks >= game.property.team2Bid, 10 * game.property.team2Bid + game.property.team2Tricks - game.property.team2Bid, 0 - 10 * game.property.team2Bid) + game.property.team2Nil
flow:
  root:
    kind: game
    label: Spades
    hooks:
      onEnter:
        - effectRef: fillDeck
        - effectRef: shuffleDeck
        - effectRef: dealCards
    winConditions:
      - rule: condition
        condition: (player.property.team == 1 and game.property.team1Score > game.property.team2Score) or (player.property.team == 2 and game.property.team2Score > game.property.team1Score)
    children:
      - kind: turn
        id: seating
        label: Seating
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: seatSetup
      - kind: turn
        id: bidding
        label: Bidding
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
          startingPlayer:
            stateRef: game.property.leader
        grammar:
          kind: action
          ref: placeBid
      - kind: loop
        id: tricks
        label: Tricks
        count: 13
        hooks:
          onComplete:
            - effectRef: sumTeam1Bid
            - effectRef: sumTeam2Bid
            - effectRef: sumTeam1Tricks
            - effectRef: sumTeam2Tricks
            - effectRef: scoreTeam1Nil
            - effectRef: scoreTeam2Nil
            - effectRef: scoreTeam1
            - effectRef: scoreTeam2
        children:
          - kind: turn
            id: playTrick
            label: Play a card
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
              startingPlayer:
                stateRef: game.property.leader
            grammar:
              kind: action
              ref: playCard
            hooks:
              onComplete:
                - effectRef: chaincraft:dominant-gamepiece:resolve
                - effectRef: awardTrick
                - effectRef: winnerLeads
                - effectRef: clearTable
                - effectRef: resetLedSuit
                - effectRef: resetRoundWinner
gamepieceTypes:
  types:
    - id: card
      category: card
      description: A playing card from the standard 52-card deck. Aces are high (rank 14).
      properties:
        - id: suit
          label: Suit
          type:
            kind: string
          mutable: false
          visibility: always
        - id: rank
          label: Rank
          type:
            kind: number
            min: 2
            max: 14
          mutable: false
          visibility: always
        - id: trickRank
          label: Trick strength
          type:
            kind: number
          mutable: true
          default: 0
          visibility: always
          description: 'Strength in the current trick, set when the card is played: rank + 100 for a spade, rank + 50 for the led suit, rank otherwise.'
inventories:
  types:
    - id: deck
      label: Deck
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      structure: stack
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - card
      visibility: owner
      displayHint: fan
    - id: table
      label: Table
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      description: Cards played to the current trick.
    - id: discard
      label: Taken tricks
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      description: Cards from completed tricks.
mechanics:
  - kind: chaincraft:dominant-gamepiece
    label: Trick resolution
    evaluationInventory: table
    winnerToState: game.property.roundWinner
    rules:
      - kind: comparison
        property: trickRank
        direction: highest
metadata:
  name: Spades
  playerCount:
    min: 4
    max: 4
state:
  game:
    properties:
      - id: seatNo
        type:
          kind: number
        default: 0
        description: Counter used by the seating setup turn to learn each player's seat (1-4).
      - id: leader
        type:
          kind: string
        default: ''
        description: Player id who leads the current trick. Starts as the player in seat 2 (dealer's left; seat 1 deals); afterwards the previous trick winner.
      - id: roundWinner
        type:
          kind: string
        default: ''
        description: Player id of the winner of the current trick, written by the trick-resolution mechanic.
      - id: ledSuit
        type:
          kind: string
        default: ''
        description: Suit led in the current trick; empty before the first card of a trick is played.
      - id: spadesBroken
        type:
          kind: boolean
        default: false
        description: True once any spade has been played.
      - id: team1Bid
        type:
          kind: number
        default: 0
      - id: team2Bid
        type:
          kind: number
        default: 0
      - id: team1Tricks
        type:
          kind: number
        default: 0
      - id: team2Tricks
        type:
          kind: number
        default: 0
      - id: team1Nil
        type:
          kind: number
        default: 0
        description: Net Nil bonus/penalty points for partnership 1.
      - id: team2Nil
        type:
          kind: number
        default: 0
        description: Net Nil bonus/penalty points for partnership 2.
      - id: team1Score
        type:
          kind: number
        default: 0
      - id: team2Score
        type:
          kind: number
        default: 0
  player:
    properties:
      - id: team
        type:
          kind: number
        default: 0
        description: Partnership number. Seats 1 and 3 are partnership 1; seats 2 and 4 are partnership 2.
      - id: bid
        type:
          kind: number
        default: 0
        description: Tricks bid, 0 to 13. A bid of 0 is Nil.
      - id: tricks
        type:
          kind: number
        default: 0
        description: Tricks this player has taken.
