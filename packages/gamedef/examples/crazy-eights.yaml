# ---------------------------------------------------------------------------
# Crazy Eights. Authored by an AI from a plain-language brief.
#
# Two to four players, one standard 52-card deck. Deal 5 cards each (7 each
# with two players) and turn one card onto the discard pile. On your turn
# play a card that matches the rank or the active suit of the top card. An 8
# is wild: play it on anything and name the new active suit. If you cannot
# play, draw a card; if no card can be played and the draw pile is empty you
# pass.
#
# The first player to empty their hand wins. If nobody can play and the draw
# pile is empty, the player with the fewest cards wins and tied players all
# win.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - A drawn card that can be played must be played.
#  - The discard pile is never reshuffled into the draw pile.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: drawCard
      label: Draw a card
      description: Draw one card when no card in hand can be played and the draw pile is not empty.
      preconditions: count(game.inventory.deck) > 0 and not any(actor.inventory.hand, piece.property.rank == 8 or piece.property.suit == game.property.activeSuit or piece.property.rank == game.property.activeRank)
      steps:
        - effect: move
          from:
            inventory: deck
            select: top
            count: 1
          to:
            inventory: hand
    - id: playCard
      label: Play a card
      description: Play a card matching the active suit or the top discard's rank, or any 8. The suit prompt only offers a choice for an 8; any other card fixes the suit to its own.
      steps:
        - input: card
          label: Choose a card to play
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            fromPlayer: actor
            filter: piece.property.rank == 8 or piece.property.suit == game.property.activeSuit or piece.property.rank == game.property.activeRank
        - input: suit
          label: Suit the next player must match
          type:
            kind: enum
            values:
              - hearts
              - diamonds
              - clubs
              - spades
          validation: input.card.property.rank == 8 or input.suit == input.card.property.suit
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: discard
        - effect: set-state
          source:
            param: card
          path: game.property.activeRank
          value:
            var: source.property.rank
        - effect: set-state
          path: game.property.activeSuit
          value:
            param: suit
