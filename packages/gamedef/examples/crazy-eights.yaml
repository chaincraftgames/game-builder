effects:
  effects:
    - id: fillDeck
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: deck
    - id: shuffleDeck
      effect: shuffle
      inventory: deck
    - id: dealFive
      effect: distribute
      from:
        inventory: deck
        select: top
      to:
        inventory: hand
      count: 5
    - id: setTwoPlayer
      effect: set-state
      path: game.property.twoPlayer
      value:
        expr: count(players) == 2
    - id: dealTwoMore
      effect: distribute
      from:
        inventory: deck
        select: top
        filter: game.property.twoPlayer == true
      to:
        inventory: hand
      count: 2
    - id: turnStarterUp
      effect: move
      from:
        inventory: deck
        select: top
        count: 1
      to:
        inventory: discard
    - id: seedActiveSuit
      effect: set-state
      path: game.property.activeSuit
      value:
        expr: if(any(game.inventory.discard, piece.property.suit == "hearts"), "hearts", if(any(game.inventory.discard, piece.property.suit == "diamonds"), "diamonds", if(any(game.inventory.discard, piece.property.suit == "clubs"), "clubs", "spades")))
    - id: seedActiveRank
      effect: set-state
      path: game.property.activeRank
      value:
        expr: sum(game.inventory.discard, piece.property.rank)
    - id: announceStart
      effect: message
      to: all
      template: Cards dealt. Starter is face up on the discard pile. Match its suit {{state.game.property.activeSuit}} or rank, or play an 8.
flow:
  root:
    kind: game
    label: Crazy Eights
    hooks:
      onEnter:
        - effectRef: fillDeck
        - effectRef: shuffleDeck
        - effectRef: setTwoPlayer
        - effectRef: dealFive
        - effectRef: dealTwoMore
        - effectRef: turnStarterUp
        - effectRef: seedActiveSuit
        - effectRef: seedActiveRank
        - effectRef: announceStart
    winConditions:
      - rule: ranking
        property: player.property.handSize
        order: lowest
    children:
      - kind: loop
        id: rounds
        label: Turns
        checkAfter: turn
        endCondition: count(actor.inventory.hand) == 0 or (count(game.inventory.deck) == 0 and all(players, not any(player.inventory.hand, piece.property.rank == 8 or piece.property.suit == game.property.activeSuit or piece.property.rank == game.property.activeRank)))
        children:
          - kind: turn
            id: playerTurn
            label: Player turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: sequence
              steps:
                - kind: action
                  ref: drawCard
                  optional: true
                - kind: action
                  ref: playCard
                  optional: true
gamepieceTypes:
  types:
    - id: card
      category: card
      description: A standard playing card.
      properties:
        - id: suit
          label: Suit
          type:
            kind: enum
            values:
              - hearts
              - diamonds
              - clubs
              - spades
          mutable: false
          visibility: always
        - id: rank
          label: Rank
          type:
            kind: number
            min: 1
            max: 13
          mutable: false
          visibility: always
          description: 1 = Ace, 11 = Jack, 12 = Queen, 13 = King.
inventories:
  types:
    - id: deck
      label: Draw pile
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      structure: stack
      displayHint: pile
    - id: discard
      label: Discard pile
      scope:
        kind: game
      accepts:
        - card
      visibility: top-revealed
      countVisibility: always
      structure: stack
      displayHint: pile
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - card
      visibility: owner
      countVisibility: always
      displayHint: fan
metadata:
  name: Crazy Eights
  playerCount:
    min: 2
    max: 4
state:
  game:
    properties:
      - id: activeSuit
        type:
          kind: string
        default: ''
        description: The suit the next play must match. Set to the played card's suit, or to the suit named when an 8 is played. Seeded from the starter card at setup.
      - id: activeRank
        type:
          kind: number
        default: 0
        description: Rank of the top discard, which the next play may match instead of the suit. After an 8 it keeps the 8's rank, so another 8 is matchable by rank.
      - id: twoPlayer
        type:
          kind: boolean
        default: false
        description: True when exactly two players are seated, which deals 7-card hands instead of 5.
  player:
    properties:
      - id: handSize
        type:
          kind: number
        computed:
          inventory: hand
          aggregate: count
        description: Cards in this player's hand. Used to rank players at game end.
