# ---------------------------------------------------------------------------
# High Card (authored variant). Authored by an AI from a plain-language
# brief.
#
# Two players and a 6-card deck with values 1 to 6, shuffled, 3 cards dealt
# to each player. There are three tricks. In each trick both players play one
# card face up from their hand; the higher card wins the trick and scores 1
# point. Values are unique, so a trick can never tie. After three tricks the
# player with more points wins.
#
# The spec below is the authored spec unchanged; only this header was added.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: playCard
      label: Play a Card
      description: Play one card from your hand face up to the table.
      steps:
        - input: card
          label: Choose a card to play
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            fromPlayer: actor
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: table
catalog:
  entries:
    - id: card1
      typeId: card
      properties:
        value: 1
    - id: card2
      typeId: card
      properties:
        value: 2
    - id: card3
      typeId: card
      properties:
        value: 3
    - id: card4
      typeId: card
      properties:
        value: 4
    - id: card5
      typeId: card
      properties:
        value: 5
    - id: card6
      typeId: card
      properties:
        value: 6
effects:
  effects:
    - id: fillDeck
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: deck
    - id: shuffleDeck
      effect: shuffle
      inventory: deck
    - id: dealCards
      effect: distribute
      from:
        inventory: deck
        select: top
      to:
        inventory: hand
      count: 3
    - id: announceStart
      effect: message
      to: all
      template: Cards dealt. Highest card takes the trick — most tricks wins!
    - id: awardTrick
      effect: set-state
      path: player.property.score
      value:
        delta: 1
      target:
        stateRef: game.property.roundWinner
    - id: announceTrick
      effect: message
      to: all
      template: '{{state.game.property.roundWinner}} takes the trick!'
    - id: clearTable
      effect: move
      from:
        inventory: table
        select: all
        ofType: card
      to:
        inventory: discard
    - id: resetRoundWinner
      effect: set-state
      path: game.property.roundWinner
      value: ''
flow:
  root:
    kind: game
    label: High Card
    hooks:
      onEnter:
        - effectRef: fillDeck
        - effectRef: shuffleDeck
        - effectRef: dealCards
        - effectRef: announceStart
    winConditions:
      - rule: ranking
        property: player.property.score
        order: highest
    children:
      - kind: loop
        id: tricks
        label: Tricks
        count: 3
        children:
          - kind: turn
            id: playTrick
            label: Play a card
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: action
              ref: playCard
            hooks:
              onComplete:
                - effectRef: chaincraft:dominant-gamepiece:resolve
                - effectRef: awardTrick
                - effectRef: announceTrick
                - effectRef: clearTable
                - effectRef: resetRoundWinner
gamepieceTypes:
  types:
    - id: card
      category: card
      description: A numbered card. Higher wins the trick.
      properties:
        - id: value
          label: Value
          type:
            kind: number
            min: 1
            max: 6
          mutable: false
          visibility: always
inventories:
  types:
    - id: deck
      label: Deck
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      structure: stack
      description: The face-down draw deck.
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - card
      visibility: owner
      description: Each player's hand, visible only to its owner.
    - id: table
      label: Table
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      description: Cards played to the current trick, face up.
    - id: discard
      label: Discard
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      description: Cards from completed tricks, face up.
mechanics:
  - kind: chaincraft:dominant-gamepiece
    label: Trick Resolution
    evaluationInventory: table
    winnerToState: game.property.roundWinner
    rules:
      - kind: comparison
        property: value
        direction: highest
metadata:
  name: High Card
  playerCount:
    min: 2
    max: 2
state:
  game:
    properties:
      - id: roundWinner
        type:
          kind: string
        default: ''
        description: Player ID of the winner of the current trick. Written by the chaincraft:dominant-gamepiece mechanic's resolve effect; read by awardTrick and announceTrick, then reset for the next trick. Card values are unique so a trick can never tie.
  player:
    properties:
      - id: score
        type:
          kind: number
          min: 0
          max: 3
        default: 0
        description: Number of tricks this player has won.
