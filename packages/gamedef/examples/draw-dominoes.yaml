# ---------------------------------------------------------------------------
# Draw Dominoes (one round). Authored by an AI from a plain-language brief.
#
# Two players, a double-six set of 28 tiles. Each player is dealt 7 tiles and
# the other 14 form a face-down boneyard. The holder of the highest double
# opens with it, or with the highest-pip tile if no double was dealt. Players
# then extend the line by matching a half of one of their tiles to an open
# end. A player with no matching tile draws from the boneyard until one fits
# or it is empty, and passes if nothing fits and the boneyard is empty.
#
# The round ends when a player empties their hand, who wins and scores the
# opponent's pips, or when two passes in a row block the game, in which case
# the lower pip total wins and scores the difference. Equal totals are a tie.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - The line is an unordered inventory with the two open ends tracked in
#    state, so the order of the line cannot be shown from the spec alone.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: playOpening
      label: Play the opening tile
      description: The player holding the highest double (or else the highest-pip tile) must play it to start the line.
      preconditions: game.property.leftEnd < 0
      steps:
        - input: tile
          label: Play your highest tile
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: tile
            fromPlayer: actor
            filter: all(actor.inventory.hand, piece.property.startWeight <= target.property.startWeight)
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: tile
          to:
            inventory: chain
        - effect: set-state
          path: game.property.leftEnd
          value:
            expr: input.tile.property.a
        - effect: set-state
          path: game.property.rightEnd
          value:
            expr: input.tile.property.b
        - effectRef: markPlayed
        - effectRef: resetPasses
        - effectRef: checkEmptyHand
    - id: playLeft
      label: Play on the left end
      description: Play a tile with a half matching the left open end; its other half becomes the new left end.
      preconditions: game.property.leftEnd >= 0
      steps:
        - input: tile
          label: Choose a tile to play
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: tile
            fromPlayer: actor
            filter: piece.property.a == game.property.leftEnd or piece.property.b == game.property.leftEnd
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: tile
          to:
            inventory: chain
        - effect: set-state
          path: game.property.leftEnd
          value:
            expr: if(input.tile.property.a == game.property.leftEnd, input.tile.property.b, input.tile.property.a)
        - effectRef: markPlayed
        - effectRef: resetPasses
        - effectRef: checkEmptyHand
    - id: playRight
      label: Play on the right end
      description: Play a tile with a half matching the right open end; its other half becomes the new right end.
      preconditions: game.property.rightEnd >= 0
      steps:
        - input: tile
          label: Choose a tile to play
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: tile
            fromPlayer: actor
            filter: piece.property.a == game.property.rightEnd or piece.property.b == game.property.rightEnd
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: tile
          to:
            inventory: chain
        - effect: set-state
          path: game.property.rightEnd
          value:
            expr: if(input.tile.property.a == game.property.rightEnd, input.tile.property.b, input.tile.property.a)
        - effectRef: markPlayed
        - effectRef: resetPasses
        - effectRef: checkEmptyHand
    - id: drawTile
      label: Draw from the boneyard
      description: You cannot play, so draw one tile from the boneyard.
      preconditions: game.property.leftEnd >= 0 and count(game.inventory.boneyard) > 0 and count(actor.inventory.hand, piece.property.a == game.property.leftEnd or piece.property.b == game.property.leftEnd or piece.property.a == game.property.rightEnd or piece.property.b == game.property.rightEnd) == 0
      steps:
        - effect: move
          from:
            inventory: boneyard
            select: top
            count: 1
          to:
            inventory: hand
    - id: passTurn
      label: Pass
      description: You cannot play and the boneyard is empty.
      preconditions: game.property.leftEnd >= 0 and count(game.inventory.boneyard) == 0 and count(actor.inventory.hand, piece.property.a == game.property.leftEnd or piece.property.b == game.property.leftEnd or piece.property.a == game.property.rightEnd or piece.property.b == game.property.rightEnd) == 0
      steps:
        - effect: set-state
          path: game.property.passes
          value:
            delta: 1
        - effect: set-state
          path: game.property.lastMover
          value:
            actor: true
        - effect: set-state
          path: game.property.finished
          value:
            expr: if(game.property.passes >= 2, true, game.property.finished)
    - id: tallyOpening
      label: Weigh opening tiles
      description: Automatic setup step run once per player.
      steps:
        - effect: set-state
          path: player.property.openWeight
          value:
            expr: sum(actor.inventory.hand, piece.property.startWeight)
    - id: claimOpening
      label: Decide who opens
      description: Automatic setup step run once per player; records the player holding the opening tile.
      steps:
        - effect: set-state
          path: game.property.firstPlayer
          value:
            expr: if(actor.property.openWeight > sum(players, player.property.openWeight) - actor.property.openWeight, actor.id, game.property.firstPlayer)
    - id: tallyPips
      label: Count pips
      description: Automatic end-of-round step run once per player.
      steps:
        - effect: set-state
          path: player.property.pips
          value:
            expr: sum(actor.inventory.hand, piece.property.pips)
    - id: scoreRound
      label: Score the round
      description: 'Automatic end-of-round step run once per player. A player with no tiles wins; otherwise the lower pip total wins. The winner scores the opponent''s pips minus their own (which equals the opponent''s total when the winner has no tiles). Equal totals are a tie: nobody wins and nobody scores.'
      steps:
        - effect: set-state
          path: player.property.won
          value:
            expr: if(count(actor.inventory.hand) == 0, true, actor.property.pips < sum(players, player.property.pips) - actor.property.pips)
        - effect: set-state
          path: player.property.score
          value:
            expr: if(actor.property.won == true, sum(players, player.property.pips) - 2 * actor.property.pips, 0)
