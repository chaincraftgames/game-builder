effects:
  effects:
    - id: fillBoneyard
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: tile
      to:
        inventory: boneyard
    - id: shuffleBoneyard
      effect: shuffle
      inventory: boneyard
    - id: dealHands
      effect: distribute
      from:
        inventory: boneyard
        select: top
      to:
        inventory: hand
      count: 7
    - id: markPlayed
      effect: set-state
      path: game.property.lastMover
      value:
        actor: true
    - id: resetPasses
      effect: set-state
      path: game.property.passes
      value: 0
    - id: checkEmptyHand
      effect: set-state
      path: game.property.finished
      value:
        expr: if(count(actor.inventory.hand) == 0, true, game.property.finished)
flow:
  root:
    kind: game
    label: Draw Dominoes
    hooks:
      onEnter:
        - effectRef: fillBoneyard
        - effectRef: shuffleBoneyard
        - effectRef: dealHands
    winConditions:
      - rule: condition
        condition: player.property.won == true
    children:
      - kind: turn
        id: weighOpening
        label: Find the opening tile
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: tallyOpening
      - kind: turn
        id: decideOpener
        label: Decide who opens
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: claimOpening
      - kind: loop
        id: play
        label: Play
        endCondition: game.property.finished == true
        checkAfter: turn
        children:
          - kind: turn
            id: playerTurn
            label: Take a turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
              startingPlayer:
                stateRef: game.property.firstPlayer
            grammar:
              kind: repeat
              count:
                until: game.property.lastMover == actor.id
                max: 16
              body:
                kind: choice
                options:
                  - kind: action
                    ref: playOpening
                  - kind: action
                    ref: playLeft
                  - kind: action
                    ref: playRight
                  - kind: action
                    ref: drawTile
                  - kind: action
                    ref: passTurn
      - kind: turn
        id: countPips
        label: Count pips
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: tallyPips
      - kind: turn
        id: scoreRound
        label: Score the round
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: scoreRound
gamepieceTypes:
  types:
    - id: tile
      category: tile
      description: A domino tile with two halves.
      properties:
        - id: a
          label: Half A
          type:
            kind: number
            min: 0
            max: 6
          mutable: false
          visibility: always
        - id: b
          label: Half B
          type:
            kind: number
            min: 0
            max: 6
          mutable: false
          visibility: always
        - id: pips
          label: Pips
          type:
            kind: number
            min: 0
            max: 12
          mutable: false
          visibility: always
          description: Total of both halves.
        - id: startWeight
          label: Opening weight
          type:
            kind: number
            min: 2
            max: 600000000
          mutable: false
          visibility: always
          description: Power of two by opening rank (doubles above non-doubles; doubles by pips; non-doubles by total pips then higher half). Comparing sums of these across hands finds the hand holding the opening tile.
inventories:
  types:
    - id: boneyard
      label: Boneyard
      scope:
        kind: game
      accepts:
        - tile
      visibility: never
      countVisibility: always
      structure: stack
      displayHint: pile
      description: Face-down tiles to draw from.
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - tile
      visibility: owner
      countVisibility: always
      displayHint: fan
    - id: chain
      label: Line
      scope:
        kind: game
      accepts:
        - tile
      visibility: always
      description: Tiles played so far. The open ends are tracked in leftEnd and rightEnd.
metadata:
  name: Draw Dominoes
  playerCount:
    min: 2
    max: 2
state:
  game:
    properties:
      - id: leftEnd
        type:
          kind: number
          min: -1
          max: 6
        default: -1
        description: Pip count of the left open end of the line; -1 while the line is empty.
      - id: rightEnd
        type:
          kind: number
          min: -1
          max: 6
        default: -1
        description: Pip count of the right open end of the line; -1 while the line is empty.
      - id: firstPlayer
        type:
          kind: string
        default: ''
        description: Player id of the player who holds the opening tile and plays first.
      - id: lastMover
        type:
          kind: string
        default: ''
        description: Player id of whoever last played or passed; a turn ends when this equals the acting player.
      - id: passes
        type:
          kind: number
          min: 0
          max: 2
        default: 0
        description: Consecutive passes. Reset by any play.
      - id: finished
        type:
          kind: boolean
        default: false
        description: True once a player has emptied their hand or the game is blocked.
  player:
    properties:
      - id: openWeight
        type:
          kind: number
          min: 0
          max: 600000000
        default: 0
        description: Sum of the startWeight of the tiles in hand; the larger sum holds the opening tile.
      - id: pips
        type:
          kind: number
          min: 0
          max: 200
        default: 0
        description: Total pips left in hand at the end of the round.
      - id: won
        type:
          kind: boolean
        default: false
        description: True if this player won the round.
      - id: score
        type:
          kind: number
          min: 0
          max: 200
        default: 0
        description: Points scored for the round (winner only).
