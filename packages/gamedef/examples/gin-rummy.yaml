effects:
  effects:
    - id: fillStock
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: stock
    - id: shuffleStock
      effect: shuffle
      inventory: stock
    - id: dealHands
      effect: distribute
      from:
        inventory: stock
        select: top
      to:
        inventory: hand
      count: 10
    - id: turnUpcard
      effect: move
      from:
        inventory: stock
        select: top
        count: 1
      to:
        inventory: discard
flow:
  root:
    kind: game
    label: Gin Rummy
    hooks:
      onEnter:
        - effectRef: fillStock
        - effectRef: shuffleStock
        - effectRef: dealHands
        - effectRef: turnUpcard
    winConditions:
      - rule: ranking
        property: player.property.score
        order: highest
        tiebreak: no-winner
    children:
      - kind: turn
        id: seating
        label: Seating
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: seat
      - kind: loop
        id: play
        label: Play the hand
        endCondition: game.property.handOver == true
        checkAfter: turn
        children:
          - kind: turn
            id: playerTurn
            label: Turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
              startingPlayer:
                stateRef: game.property.nonDealer
            grammar:
              kind: repeat
              count:
                until: game.property.turnDone == true
              body:
                kind: choice
                options:
                  - kind: action
                    ref: drawStock
                  - kind: action
                    ref: drawDiscard
                  - kind: action
                    ref: takeUpcard
                  - kind: action
                    ref: passUpcard
                  - kind: action
                    ref: meldSet
                  - kind: action
                    ref: meldRun
                  - kind: action
                    ref: extendSet
                  - kind: action
                    ref: extendRun
                  - kind: action
                    ref: clearMelds
                  - kind: action
                    ref: discardCard
                  - kind: action
                    ref: knock
      - kind: turn
        id: showdown
        label: Opponent lays off and the hand is scored
        actor:
          player:
            stateRef: game.property.defender
        grammar:
          kind: repeat
          count:
            until: game.property.defenseDone == true
          body:
            kind: choice
            options:
              - kind: action
                ref: meldSet
              - kind: action
                ref: meldRun
              - kind: action
                ref: extendSet
              - kind: action
                ref: extendRun
              - kind: action
                ref: clearMelds
              - kind: action
                ref: layoffSet
              - kind: action
                ref: layoffRun
              - kind: action
                ref: concludeHand
              - kind: action
                ref: concludeDraw
gamepieceTypes:
  types:
    - id: card
      category: card
      description: A playing card.
      properties:
        - id: rank
          label: Rank
          type:
            kind: number
            min: 1
            max: 13
          mutable: false
          visibility: always
          description: Ace 1 (low) to King 13. Used for sets and runs.
        - id: suit
          label: Suit
          type:
            kind: string
          mutable: false
          visibility: always
          description: S, H, D or C.
        - id: value
          label: Deadwood value
          type:
            kind: number
            min: 1
            max: 10
          mutable: false
          visibility: always
          description: Ace 1, 2-10 face, J/Q/K 10.
        - id: meld
          label: Meld
          type:
            kind: number
            min: 0
            max: 2
          mutable: true
          default: 0
          visibility: always
          description: 0 = unmatched (deadwood), 1 = in a declared set, 2 = in a declared run. Declared by the player each turn.
        - id: fromDiscard
          label: Taken from discard
          type:
            kind: boolean
          mutable: true
          default: false
          visibility: always
          description: True for the card just taken from the discard pile this turn; it may not be discarded.
inventories:
  types:
    - id: stock
      label: Stock
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      structure: stack
      displayHint: pile
      description: Face-down draw pile.
    - id: discard
      label: Discard pile
      scope:
        kind: game
      accepts:
        - card
      visibility: top-revealed
      countVisibility: always
      structure: stack
      displayHint: pile
      description: Face-up discard pile; the top card may be drawn.
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - card
      visibility: owner
      structure: none
      displayHint: fan
      description: A player's hidden hand.
    - id: melds
      label: Knocker's melds
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      structure: none
      description: The knocker's declared melds, laid face up when knocking, plus cards laid off onto them.
metadata:
  name: Gin Rummy
  playerCount:
    min: 2
    max: 2
state:
  game:
    properties:
      - id: dealer
        type:
          kind: string
        default: ''
        description: Player id of the dealer (seat 1). Recorded in the seating turn.
      - id: nonDealer
        type:
          kind: string
        default: ''
        description: Player id of the non-dealer (seat 2); acts first.
      - id: knocker
        type:
          kind: string
        default: ''
        description: Player id of the player who knocked; empty if nobody has.
      - id: defender
        type:
          kind: string
        default: ''
        description: Player id of the opponent of the knocker; empty if nobody knocked.
      - id: stage
        type:
          kind: number
          min: 0
          max: 3
        default: 0
        description: Opening offer stage. 0 non-dealer may take upcard, 1 dealer may take it, 2 both passed so non-dealer must draw from stock, 3 normal play.
      - id: turnDone
        type:
          kind: boolean
        default: false
        description: True when the current turn has ended; cleared when the next turn draws.
      - id: handOver
        type:
          kind: boolean
        default: false
        description: True once a knock/gin happens or the stock runs down to two cards.
      - id: defending
        type:
          kind: boolean
        default: false
        description: True once a knock happened, i.e. the opponent is melding and laying off.
      - id: defenseDone
        type:
          kind: boolean
        default: false
        description: True when the hand has been scored.
      - id: knockerDW
        type:
          kind: number
        default: 0
        description: Knocker's deadwood after discarding.
      - id: defenderDW
        type:
          kind: number
        default: 0
        description: Opponent's deadwood after melding and laying off.
      - id: knockerPts
        type:
          kind: number
        default: 0
        description: Points scored by the knocker this hand.
      - id: defenderPts
        type:
          kind: number
        default: 0
        description: Points scored by the opponent this hand.
  player:
    properties:
      - id: score
        type:
          kind: number
          min: 0
        default: 0
        description: Points scored in the hand.
