# ---------------------------------------------------------------------------
# Gin Rummy (one hand). Authored by an AI from a plain-language brief.
#
# Two players, one standard 52-card deck (ace low, king high, no wrap). Deal
# 10 cards each and turn one card up as the discard pile. Player 1 deals and
# player 2 acts first. In the opening offer the non-dealer may take the
# upcard or pass, then the dealer may; if both pass the non-dealer draws from
# the stock.
#
# On a turn draw from the stock or the discard pile, declare melds (sets of 3
# or 4 of a rank, runs of 3 or more in a suit), then discard or knock. A card
# just taken from the discard pile cannot be discarded. Knock by discarding
# so that unmatched cards (deadwood) total 10 or less; zero deadwood is gin.
# The opponent then declares their own melds and, unless it was gin, lays off
# cards on the knocker's melds.
#
# Scoring: gin scores the opponent's deadwood plus 25. Otherwise if the
# knocker's deadwood is lower the knocker scores the difference, else the
# opponent scores the difference plus 25 (an undercut). If the stock falls to
# two cards after a discard the hand is drawn and nobody scores. The higher
# score wins.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - Players declare their own melds; the engine cannot search for the best
#    arrangement.
#  - Discarding out of a four-card meld when knocking (big gin) is not
#    supported.
#  - The knock, lay-off and scoring actions validate and compile but were not
#    reached by a random playtest.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: seat
      label: Take seat
      description: Records who is dealer (seat 1) and non-dealer (seat 2). Runs once per player at setup.
      steps:
        - effect: set-state
          path: game.property.dealer
          value:
            expr: if(game.property.dealer == "", actor.id, game.property.dealer)
        - effect: set-state
          path: game.property.nonDealer
          value:
            expr: if(actor.id != game.property.dealer, actor.id, game.property.nonDealer)
    - id: drawStock
      label: Draw from stock
      preconditions: count(actor.inventory.hand) == 10 and (game.property.stage == 2 or game.property.stage == 3)
      steps:
        - effect: move
          from:
            inventory: stock
            select: top
            count: 1
          to:
            inventory: hand
        - effect: set-state
          path: game.property.stage
          value: 3
        - effect: set-state
          path: game.property.turnDone
          value: false
    - id: drawDiscard
      label: Take top of discard pile
      preconditions: count(actor.inventory.hand) == 10 and game.property.stage == 3
      steps:
        - effect: update
          pieces:
            inventory: discard
            select: top
            count: 1
          property: fromDiscard
          value: true
        - effect: move
          from:
            inventory: discard
            select: top
            count: 1
          to:
            inventory: hand
        - effect: set-state
          path: game.property.turnDone
          value: false
    - id: takeUpcard
      label: Take the upcard
      description: Opening offer. Take the turned-up card, then discard or knock as usual.
      preconditions: count(actor.inventory.hand) == 10 and game.property.stage <= 1
      steps:
        - effect: update
          pieces:
            inventory: discard
            select: top
            count: 1
          property: fromDiscard
          value: true
        - effect: move
          from:
            inventory: discard
            select: top
            count: 1
          to:
            inventory: hand
        - effect: set-state
          path: game.property.stage
          value: 3
        - effect: set-state
          path: game.property.turnDone
          value: false
    - id: passUpcard
      label: Pass on the upcard
      description: Opening offer. Decline the turned-up card; the turn ends.
      preconditions: count(actor.inventory.hand) == 10 and game.property.stage <= 1
      steps:
        - effect: set-state
          path: game.property.stage
          value:
            delta: 1
        - effect: set-state
          path: game.property.turnDone
          value: true
    - id: meldSet
      label: Declare a set
      description: Declare three cards of the same rank as a set.
      preconditions: (count(actor.inventory.hand) == 11 and game.property.defending == false) or game.property.defending == true
      steps:
        - input: a
          label: First card
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0
        - input: b
          label: Second card of the same rank
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and piece.property.rank == input.a.property.rank and piece.id != input.a
        - input: c
          label: Third card of the same rank
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and piece.property.rank == input.a.property.rank and piece.id != input.a and piece.id != input.b
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: a
          property: meld
          value: 1
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: b
          property: meld
          value: 1
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: c
          property: meld
          value: 1
    - id: meldRun
      label: Declare a run
      description: Declare three consecutive cards of one suit as a run. Pick the lowest card first.
      preconditions: (count(actor.inventory.hand) == 11 and game.property.defending == false) or game.property.defending == true
      steps:
        - input: a
          label: Lowest card
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0
        - input: b
          label: Next card up, same suit
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and piece.property.suit == input.a.property.suit and piece.property.rank == input.a.property.rank + 1
        - input: c
          label: Next card up, same suit
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and piece.property.suit == input.a.property.suit and piece.property.rank == input.a.property.rank + 2
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: a
          property: meld
          value: 2
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: b
          property: meld
          value: 2
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: c
          property: meld
          value: 2
    - id: extendSet
      label: Add a card to a declared set
      preconditions: (count(actor.inventory.hand) == 11 and game.property.defending == false) or game.property.defending == true
      steps:
        - input: card
          label: Card of the same rank as a declared set
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and any(actor.inventory.hand, piece.property.meld == 1 and piece.property.rank == target.property.rank)
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: card
          property: meld
          value: 1
    - id: extendRun
      label: Add a card to a declared run
      preconditions: (count(actor.inventory.hand) == 11 and game.property.defending == false) or game.property.defending == true
      steps:
        - input: card
          label: Card that extends a declared run at either end
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and any(actor.inventory.hand, piece.property.meld == 2 and piece.property.suit == target.property.suit and (piece.property.rank == target.property.rank + 1 or piece.property.rank == target.property.rank - 1))
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: card
          property: meld
          value: 2
    - id: clearMelds
      label: Undo declared melds
      preconditions: any(actor.inventory.hand, piece.property.meld != 0) and ((count(actor.inventory.hand) == 11 and game.property.defending == false) or game.property.defending == true)
      steps:
        - effect: update
          pieces:
            inventory: hand
            select: all
          property: meld
          value: 0
    - id: discardCard
      label: Discard
      description: Discard one card to end your turn. You may not discard the card you just took from the discard pile.
      preconditions: count(actor.inventory.hand) == 11 and game.property.defending == false
      steps:
        - input: card
          label: Card to discard
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.fromDiscard == false
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: discard
        - effect: update
          pieces:
            inventory: hand
            select: all
          property: meld
          value: 0
        - effect: update
          pieces:
            inventory: hand
            select: all
          property: fromDiscard
          value: false
        - effect: set-state
          path: game.property.handOver
          value:
            expr: if(count(game.inventory.stock) <= 2, true, false)
        - effect: set-state
          path: game.property.turnDone
          value: true
    - id: knock
      label: Knock
      description: Discard an unmatched card (not the card just taken from the discard pile) leaving at most 10 deadwood. All 10 cards matched is gin.
      preconditions: count(actor.inventory.hand) == 11 and game.property.defending == false
      steps:
        - input: card
          label: Unmatched card to discard
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and piece.property.fromDiscard == false and sum(actor.inventory.hand, piece.property.value, piece.property.meld == 0) - target.property.value <= 10
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: discard
        - effect: set-state
          path: game.property.knockerDW
          value:
            expr: sum(actor.inventory.hand, piece.property.value, piece.property.meld == 0)
        - effect: set-state
          path: game.property.knocker
          value:
            actor: true
        - effect: set-state
          path: game.property.defender
          value:
            expr: if(actor.id == game.property.dealer, game.property.nonDealer, game.property.dealer)
        - effect: move
          from:
            inventory: hand
            select: all
            filter: piece.property.meld != 0
          to:
            inventory: melds
        - effect: set-state
          path: game.property.defending
          value: true
        - effect: set-state
          path: game.property.handOver
          value: true
        - effect: set-state
          path: game.property.turnDone
          value: true
    - id: layoffSet
      label: Lay off on a set
      description: Add an unmatched card to one of the knocker's sets.
      preconditions: game.property.defending == true and game.property.knockerDW > 0
      steps:
        - input: card
          label: Card of the same rank as a set
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and any(game.inventory.melds, piece.property.meld == 1 and piece.property.rank == target.property.rank)
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: card
          property: meld
          value: 1
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: melds
    - id: layoffRun
      label: Lay off on a run
      description: Add an unmatched card to either end of one of the knocker's runs.
      preconditions: game.property.defending == true and game.property.knockerDW > 0
      steps:
        - input: card
          label: Card that extends a run at either end
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            filter: piece.property.meld == 0 and any(game.inventory.melds, piece.property.meld == 2 and piece.property.suit == target.property.suit and (piece.property.rank == target.property.rank + 1 or piece.property.rank == target.property.rank - 1))
        - effect: update
          pieces:
            inventory: hand
            select:
              id:
                param: card
          property: meld
          value: 2
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: melds
    - id: concludeHand
      label: Finish and score
      description: Ends the hand after a knock or gin and awards points.
      preconditions: game.property.handOver == true and game.property.defending == true
      steps:
        - effect: set-state
          path: game.property.defenderDW
          value:
            expr: sum(actor.inventory.hand, piece.property.value, piece.property.meld == 0)
        - effect: set-state
          path: game.property.knockerPts
          value:
            expr: if(game.property.knockerDW == 0, game.property.defenderDW + 25, if(game.property.knockerDW < game.property.defenderDW, game.property.defenderDW - game.property.knockerDW, 0))
        - effect: set-state
          path: game.property.defenderPts
          value:
            expr: if(game.property.knockerDW == 0, 0, if(game.property.knockerDW < game.property.defenderDW, 0, game.property.knockerDW - game.property.defenderDW + 25))
        - effect: set-state
          path: player.property.score
          value:
            delta:
              var: game.property.knockerPts
          target:
            stateRef: game.property.knocker
        - effect: set-state
          path: player.property.score
          value:
            delta:
              var: game.property.defenderPts
          target:
            stateRef: game.property.defender
        - effect: set-state
          path: game.property.defenseDone
          value: true
    - id: concludeDraw
      label: Finish drawn hand
      description: The stock ran down to two cards with no knock; the hand is drawn and nobody scores.
      preconditions: game.property.handOver == true and game.property.defending == false
      steps:
        - effect: set-state
          path: game.property.defenseDone
          value: true
