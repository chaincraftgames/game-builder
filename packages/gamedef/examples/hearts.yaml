# ---------------------------------------------------------------------------
# Hearts. Authored by an AI from a plain-language brief.
#
# Four players, one standard 52-card deck, 13 cards each, no passing phase. A
# single hand of 13 tricks is the whole game. Each heart is worth 1 point and
# the queen of spades is worth 13 (26 points in total). The lowest score wins
# and players tied for the lowest share the win.
#
# The holder of the 2 of clubs leads the first trick. A player must follow
# the led suit if able. On the first trick no hearts or queen of spades may
# be played unless the hand holds nothing else. Hearts cannot be led until a
# heart has been played, unless the leader holds only hearts. The highest
# card of the led suit takes the trick, scores its points and leads next.
#
# Shooting the moon: if one player takes all 26 points, that player scores 0
# and every other player scores 26.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - Single hand only, no card passing.
#  - The shoot-the-moon path validates and compiles but was not seen running
#    in a random playtest.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: findLeader
      label: Find the 2 of clubs
      description: Runs once per player before play; the holder of the 2 of clubs becomes the first leader.
      steps:
        - effect: set-state
          path: game.property.leader
          value:
            expr: if(count(actor.inventory.hand, piece.property.suit == "clubs" and piece.property.rank == 2) > 0, actor.id, game.property.leader)
    - id: playCard
      label: Play a card
      description: Play one legal card from your hand to the trick.
      steps:
        - input: card
          label: Choose a card to play
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            fromPlayer: actor
            filter: |-
              (game.property.ledSuit == "" and game.property.tricksPlayed == 0
                and piece.property.suit == "clubs" and piece.property.rank == 2)
              or (game.property.ledSuit == "" and game.property.tricksPlayed > 0
                and (game.property.heartsBroken
                  or piece.property.suit != "hearts"
                  or all(actor.inventory.hand, piece.property.suit == "hearts")))
              or (game.property.ledSuit != ""
                and (piece.property.suit == game.property.ledSuit
                  or (count(actor.inventory.hand, piece.property.suit == game.property.ledSuit) == 0
                    and (game.property.tricksPlayed > 0
                      or piece.property.points == 0
                      or all(actor.inventory.hand, piece.property.points > 0)))))
        - effect: set-state
          path: game.property.ledSuit
          value:
            expr: if(game.property.ledSuit == "", input.card.property.suit, game.property.ledSuit)
        - effect: set-state
          path: game.property.heartsBroken
          value:
            expr: if(input.card.property.suit == "hearts", true, game.property.heartsBroken)
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: table
    - id: settleMoon
      label: Settle shooting the moon
      description: Runs once per player after the last trick. If one player took all 26 points they score 0 and everyone else scores 26; otherwise scores are unchanged.
      steps:
        - effect: set-state
          path: player.property.points
          value:
            expr: if(game.property.moonShot, if(actor.property.points == 26, 0, 26), actor.property.points)
