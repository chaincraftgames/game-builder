effects:
  effects:
    - id: fillDeck
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: deck
    - id: shuffleDeck
      effect: shuffle
      inventory: deck
    - id: dealCards
      effect: distribute
      from:
        inventory: deck
        select: top
      to:
        inventory: hand
      count: 13
    - id: markTrickRanks
      effect: update
      pieces:
        inventory: table
        select: all
        ofType: card
      property: trickRank
      value:
        expr: if(target.property.suit == game.property.ledSuit, target.property.rank, 0)
    - id: computeTrickPoints
      effect: set-state
      path: game.property.trickPoints
      value:
        expr: sum(game.inventory.table, piece.property.points)
    - id: awardTrick
      effect: set-state
      path: player.property.points
      value:
        delta:
          var: game.property.trickPoints
      target:
        stateRef: game.property.trickWinner
    - id: setLeaderToWinner
      effect: set-state
      path: game.property.leader
      value:
        var: game.property.trickWinner
    - id: clearTable
      effect: move
      from:
        inventory: table
        select: all
        ofType: card
      to:
        inventory: discard
    - id: resetLedSuit
      effect: set-state
      path: game.property.ledSuit
      value: ''
    - id: countTrick
      effect: set-state
      path: game.property.tricksPlayed
      value:
        delta: 1
    - id: computeMoon
      effect: set-state
      path: game.property.moonShot
      value:
        expr: any(players, player.property.points == 26)
flow:
  root:
    kind: game
    label: Hearts
    hooks:
      onEnter:
        - effectRef: fillDeck
        - effectRef: shuffleDeck
        - effectRef: dealCards
    winConditions:
      - rule: ranking
        property: player.property.points
        order: lowest
    children:
      - kind: turn
        id: findLeader
        label: Find the 2 of clubs
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: findLeader
      - kind: loop
        id: tricks
        label: Tricks
        count: 13
        hooks:
          onComplete:
            - effectRef: computeMoon
        children:
          - kind: turn
            id: playTrick
            label: Play a card
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
              startingPlayer:
                stateRef: game.property.leader
            grammar:
              kind: action
              ref: playCard
            hooks:
              onComplete:
                - effectRef: markTrickRanks
                - effectRef: chaincraft:dominant-gamepiece:resolve
                - effectRef: computeTrickPoints
                - effectRef: awardTrick
                - effectRef: setLeaderToWinner
                - effectRef: clearTable
                - effectRef: resetLedSuit
                - effectRef: countTrick
      - kind: turn
        id: settleMoon
        label: Settle shooting the moon
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: settleMoon
gamepieceTypes:
  types:
    - id: card
      category: card
      description: A standard playing card. Aces are high (rank 14).
      properties:
        - id: suit
          label: Suit
          type:
            kind: string
          mutable: false
          visibility: always
        - id: rank
          label: Rank
          type:
            kind: number
            min: 2
            max: 14
          mutable: false
          visibility: always
        - id: points
          label: Points
          type:
            kind: number
            min: 0
            max: 13
          mutable: false
          visibility: always
          description: Penalty points when taken - 1 for hearts, 13 for the queen of spades, otherwise 0.
        - id: trickRank
          label: Trick rank
          type:
            kind: number
            min: 0
            max: 14
          mutable: true
          source: runtime
          default: 0
          visibility: always
          description: Set when a trick is resolved - the card's rank if it follows the led suit, else 0. The highest trick rank on the table wins the trick.
inventories:
  types:
    - id: deck
      label: Deck
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      structure: stack
      description: The shuffled deck, dealt out at the start.
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - card
      visibility: owner
      displayHint: fan
      description: Each player's hidden hand.
    - id: table
      label: Trick
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      description: Cards played to the current trick.
    - id: discard
      label: Taken tricks
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      displayHint: pile
      description: Cards from completed tricks.
mechanics:
  - kind: chaincraft:dominant-gamepiece
    label: Trick Resolution
    evaluationInventory: table
    winnerToState: game.property.trickWinner
    rules:
      - kind: comparison
        property: trickRank
        direction: highest
metadata:
  name: Hearts
  playerCount:
    min: 4
    max: 4
state:
  game:
    properties:
      - id: leader
        type:
          kind: string
        default: ''
        description: Player id who leads the current trick. Set before trick 1 to the holder of the 2 of clubs, then to each trick's winner. Read as the turn order's starting player.
      - id: ledSuit
        type:
          kind: string
        default: ''
        description: Suit of the first card of the current trick; empty while no card has been led.
      - id: heartsBroken
        type:
          kind: boolean
        default: false
        description: True once a heart has been played in any trick.
      - id: tricksPlayed
        type:
          kind: number
          min: 0
          max: 13
        default: 0
        description: Number of completed tricks. Zero means the first trick is in progress.
      - id: trickWinner
        type:
          kind: string
        default: ''
        description: Player id of the winner of the trick just played. Written by the trick-resolution mechanic.
      - id: trickPoints
        type:
          kind: number
          min: 0
          max: 26
        default: 0
        description: Points on the table in the trick just played (hearts 1 each, queen of spades 13).
      - id: moonShot
        type:
          kind: boolean
        default: false
        description: True when one player took all 26 points in the hand.
  player:
    properties:
      - id: points
        type:
          kind: number
          min: 0
          max: 26
        default: 0
        description: Points taken this hand. Lower is better.
