effects:
  effects:
    - id: fillDeck
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: deck
    - id: shuffleDeck
      effect: shuffle
      inventory: deck
    - id: dealHands
      effect: distribute
      from:
        inventory: deck
        select: top
      to:
        inventory: hand
      count: 5
    - id: ante
      effect: set-state
      path: player.property.chips
      value:
        delta: -1
      target: all
    - id: seedPot
      effect: set-state
      path: game.property.pot
      value:
        expr: count(players)
    - id: seedLive
      effect: set-state
      path: game.property.live
      value:
        expr: count(players)
    - id: announceStart
      effect: message
      to: all
      template: 'Antes paid and five cards dealt. First betting round: bets are 2 chips.'
    - id: resetBetCurrent
      effect: set-state
      path: game.property.currentBet
      value: 0
    - id: resetBetSize
      effect: set-state
      path: game.property.betSize
      value: 4
    - id: resetRaised
      effect: set-state
      path: game.property.raised
      value: false
    - id: resetRoundBets
      effect: set-state
      path: player.property.roundBet
      value: 0
      target: all
    - id: resetActed
      effect: set-state
      path: player.property.acted
      value: false
      target: all
    - id: announceRound2
      effect: message
      to: all
      template: 'Draw complete. Second betting round: bets are 4 chips.'
    - id: clearPot
      effect: set-state
      path: game.property.pot
      value: 0
    - id: scoreSig
      effect: set-state
      path: player.property.sig
      value:
        expr: count(actor.inventory.hand, piece.property.rank == 2) * count(actor.inventory.hand, piece.property.rank == 2) + count(actor.inventory.hand, piece.property.rank == 3) * count(actor.inventory.hand, piece.property.rank == 3) + count(actor.inventory.hand, piece.property.rank == 4) * count(actor.inventory.hand, piece.property.rank == 4) + count(actor.inventory.hand, piece.property.rank == 5) * count(actor.inventory.hand, piece.property.rank == 5) + count(actor.inventory.hand, piece.property.rank == 6) * count(actor.inventory.hand, piece.property.rank == 6) + count(actor.inventory.hand, piece.property.rank == 7) * count(actor.inventory.hand, piece.property.rank == 7) + count(actor.inventory.hand, piece.property.rank == 8) * count(actor.inventory.hand, piece.property.rank == 8) + count(actor.inventory.hand, piece.property.rank == 9) * count(actor.inventory.hand, piece.property.rank == 9) + count(actor.inventory.hand, piece.property.rank == 10) * count(actor.inventory.hand, piece.property.rank == 10) + count(actor.inventory.hand, piece.property.rank == 11) * count(actor.inventory.hand, piece.property.rank == 11) + count(actor.inventory.hand, piece.property.rank == 12) * count(actor.inventory.hand, piece.property.rank == 12) + count(actor.inventory.hand, piece.property.rank == 13) * count(actor.inventory.hand, piece.property.rank == 13) + count(actor.inventory.hand, piece.property.rank == 14) * count(actor.inventory.hand, piece.property.rank == 14)
    - id: scoreRaw
      effect: set-state
      path: player.property.rawBits
      value:
        expr: if(count(actor.inventory.hand, piece.property.rank == 2) == 1, 1, 0) + if(count(actor.inventory.hand, piece.property.rank == 3) == 1, 2, 0) + if(count(actor.inventory.hand, piece.property.rank == 4) == 1, 4, 0) + if(count(actor.inventory.hand, piece.property.rank == 5) == 1, 8, 0) + if(count(actor.inventory.hand, piece.property.rank == 6) == 1, 16, 0) + if(count(actor.inventory.hand, piece.property.rank == 7) == 1, 32, 0) + if(count(actor.inventory.hand, piece.property.rank == 8) == 1, 64, 0) + if(count(actor.inventory.hand, piece.property.rank == 9) == 1, 128, 0) + if(count(actor.inventory.hand, piece.property.rank == 10) == 1, 256, 0) + if(count(actor.inventory.hand, piece.property.rank == 11) == 1, 512, 0) + if(count(actor.inventory.hand, piece.property.rank == 12) == 1, 1024, 0) + if(count(actor.inventory.hand, piece.property.rank == 13) == 1, 2048, 0) + if(count(actor.inventory.hand, piece.property.rank == 14) == 1, 4096, 0)
    - id: scoreTrip
      effect: set-state
      path: player.property.tripBits
      value:
        expr: if(count(actor.inventory.hand, piece.property.rank == 2) >= 3, 1, 0) + if(count(actor.inventory.hand, piece.property.rank == 3) >= 3, 2, 0) + if(count(actor.inventory.hand, piece.property.rank == 4) >= 3, 4, 0) + if(count(actor.inventory.hand, piece.property.rank == 5) >= 3, 8, 0) + if(count(actor.inventory.hand, piece.property.rank == 6) >= 3, 16, 0) + if(count(actor.inventory.hand, piece.property.rank == 7) >= 3, 32, 0) + if(count(actor.inventory.hand, piece.property.rank == 8) >= 3, 64, 0) + if(count(actor.inventory.hand, piece.property.rank == 9) >= 3, 128, 0) + if(count(actor.inventory.hand, piece.property.rank == 10) >= 3, 256, 0) + if(count(actor.inventory.hand, piece.property.rank == 11) >= 3, 512, 0) + if(count(actor.inventory.hand, piece.property.rank == 12) >= 3, 1024, 0) + if(count(actor.inventory.hand, piece.property.rank == 13) >= 3, 2048, 0) + if(count(actor.inventory.hand, piece.property.rank == 14) >= 3, 4096, 0)
    - id: scorePair
      effect: set-state
      path: player.property.pairBits
      value:
        expr: if(count(actor.inventory.hand, piece.property.rank == 2) == 2, 1, 0) + if(count(actor.inventory.hand, piece.property.rank == 3) == 2, 2, 0) + if(count(actor.inventory.hand, piece.property.rank == 4) == 2, 4, 0) + if(count(actor.inventory.hand, piece.property.rank == 5) == 2, 8, 0) + if(count(actor.inventory.hand, piece.property.rank == 6) == 2, 16, 0) + if(count(actor.inventory.hand, piece.property.rank == 7) == 2, 32, 0) + if(count(actor.inventory.hand, piece.property.rank == 8) == 2, 64, 0) + if(count(actor.inventory.hand, piece.property.rank == 9) == 2, 128, 0) + if(count(actor.inventory.hand, piece.property.rank == 10) == 2, 256, 0) + if(count(actor.inventory.hand, piece.property.rank == 11) == 2, 512, 0) + if(count(actor.inventory.hand, piece.property.rank == 12) == 2, 1024, 0) + if(count(actor.inventory.hand, piece.property.rank == 13) == 2, 2048, 0) + if(count(actor.inventory.hand, piece.property.rank == 14) == 2, 4096, 0)
    - id: scoreFlush
      effect: set-state
      path: player.property.flush
      value:
        expr: if(count(actor.inventory.hand, piece.property.suit == "hearts") == 5 or count(actor.inventory.hand, piece.property.suit == "diamonds") == 5 or count(actor.inventory.hand, piece.property.suit == "clubs") == 5 or count(actor.inventory.hand, piece.property.suit == "spades") == 5, 1, 0)
    - id: scoreStraight
      effect: set-state
      path: player.property.straight
      value:
        expr: if(actor.property.sig == 5 and (actor.property.rawBits == 31 or actor.property.rawBits == 62 or actor.property.rawBits == 124 or actor.property.rawBits == 248 or actor.property.rawBits == 496 or actor.property.rawBits == 992 or actor.property.rawBits == 1984 or actor.property.rawBits == 3968 or actor.property.rawBits == 7936 or actor.property.rawBits == 4111), 1, 0)
    - id: scoreTotal
      effect: set-state
      path: player.property.handScore
      value:
        expr: if(actor.property.straight == 1 and actor.property.flush == 1, 8, if(actor.property.sig == 17, 7, if(actor.property.sig == 13, 6, if(actor.property.flush == 1, 5, if(actor.property.straight == 1, 4, if(actor.property.sig == 11, 3, if(actor.property.sig == 9, 2, if(actor.property.sig == 7, 1, 0)))))))) * 549755813888 + actor.property.tripBits * 67108864 + actor.property.pairBits * 8192 + if(actor.property.rawBits == 4111, 15, actor.property.rawBits)
    - id: showHand
      effect: move
      from:
        inventory: hand
        select: all
      to:
        inventory: shown
flow:
  root:
    kind: game
    label: Five-Card Draw Poker
    hooks:
      onEnter:
        - effectRef: fillDeck
        - effectRef: shuffleDeck
        - effectRef: dealHands
        - effectRef: ante
        - effectRef: seedPot
        - effectRef: seedLive
        - effectRef: announceStart
      onComplete:
        - effectRef: clearPot
    winConditions:
      - rule: ranking
        property: player.property.chips
        order: highest
    children:
      - kind: loop
        id: round1
        label: Betting round 1
        checkAfter: turn
        endCondition: game.property.live < 2 or all(players, player.property.folded or (player.property.acted and player.property.roundBet == game.property.currentBet))
        children:
          - kind: turn
            id: bet1
            label: Betting round 1 turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: choice
              options:
                - kind: action
                  ref: fold
                - kind: action
                  ref: check
                - kind: action
                  ref: bet
                - kind: action
                  ref: call
                - kind: action
                  ref: raise
                - kind: action
                  ref: sitOut
      - kind: turn
        id: discardPhase
        label: Discard up to 3 cards
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: repeat
          count:
            max: 3
          body:
            kind: choice
            passable: true
            options:
              - kind: action
                ref: discardCard
      - kind: turn
        id: drawPhase
        label: Draw replacements
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: choice
          options:
            - kind: action
              ref: drawUp
            - kind: action
              ref: sitOut
        hooks:
          onComplete:
            - effectRef: resetBetCurrent
            - effectRef: resetBetSize
            - effectRef: resetRaised
            - effectRef: resetRoundBets
            - effectRef: resetActed
            - effectRef: announceRound2
      - kind: loop
        id: round2
        label: Betting round 2
        checkAfter: turn
        endCondition: game.property.live < 2 or all(players, player.property.folded or (player.property.acted and player.property.roundBet == game.property.currentBet))
        children:
          - kind: turn
            id: bet2
            label: Betting round 2 turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: choice
              options:
                - kind: action
                  ref: fold
                - kind: action
                  ref: check
                - kind: action
                  ref: bet
                - kind: action
                  ref: call
                - kind: action
                  ref: raise
                - kind: action
                  ref: sitOut
      - kind: turn
        id: showdownReveal
        label: 'Showdown: reveal hands'
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: choice
          options:
            - kind: action
              ref: revealAndScore
            - kind: action
              ref: skipHand
      - kind: turn
        id: showdownJudge
        label: 'Showdown: find best hand'
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: choice
          options:
            - kind: action
              ref: markWinner
            - kind: action
              ref: skipFolded
      - kind: turn
        id: showdownPay
        label: 'Showdown: pay out'
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: choice
          options:
            - kind: action
              ref: payWinner
            - kind: action
              ref: skipLoser
gamepieceTypes:
  types:
    - id: card
      category: card
      description: A standard playing card. Ace is rank 14 (also plays low in a wheel straight).
      properties:
        - id: rank
          label: Rank
          type:
            kind: number
            min: 2
            max: 14
          mutable: false
          visibility: always
        - id: suit
          label: Suit
          type:
            kind: string
          mutable: false
          visibility: always
inventories:
  types:
    - id: deck
      label: Deck
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      structure: stack
      description: The face-down draw deck.
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - card
      visibility: owner
      description: Each player's five private cards.
    - id: discard
      label: Discards
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      description: Cards discarded in the draw. Face down, never revealed.
    - id: shown
      label: Showdown hand
      scope:
        kind: player
      accepts:
        - card
