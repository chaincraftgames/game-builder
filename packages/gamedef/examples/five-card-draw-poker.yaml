metadata:
  name: Five-Card Draw Poker
  playerCount:
    min: 2
    max: 4
state:
  game:
    properties:
      - id: pot
        type:
          kind: number
          min: 0
        default: 0
        description: Chips committed by all players this hand (antes and bets).
      - id: currentBet
        type:
          kind: number
          min: 0
        default: 0
        description: Highest total a player has put in during the current betting round. 0 means no bet is open.
      - id: betSize
        type:
          kind: number
          min: 0
        default: 2
        description: Fixed bet and raise increment for the current betting round (2 in round 1, 4 in round 2).
      - id: raised
        type:
          kind: boolean
        default: false
        description: True once the one allowed raise of this betting round has been made.
      - id: live
        type:
          kind: number
          min: 0
        default: 0
        description: Number of players who have not folded. Set at setup, decremented by fold.
  player:
    properties:
      - id: chips
        type:
          kind: number
        default: 100
        description: The player's chip stack.
      - id: folded
        type:
          kind: boolean
        default: false
      - id: acted
        type:
          kind: boolean
        default: false
        description: Has acted in the current betting round.
      - id: roundBet
        type:
          kind: number
          min: 0
        default: 0
        description: Chips this player has put in during the current betting round.
      - id: sig
        type:
          kind: number
        default: 0
        description: Sum over ranks of (copies of the rank in hand) squared. 5 high card or straight or flush, 7 pair, 9 two pair, 11 trips, 13 full house, 17 quads.
      - id: rawBits
        type:
          kind: number
        default: 0
        description: Bitmask (rank 2 = 1 ... ace = 4096) of ranks held exactly once.
      - id: tripBits
        type:
          kind: number
        default: 0
        description: Bitmask of ranks held three or four times.
      - id: pairBits
        type:
          kind: number
        default: 0
        description: Bitmask of ranks held exactly twice.
      - id: straight
        type:
          kind: number
        default: 0
        description: 1 if the hand is five consecutive ranks (ace may be low).
      - id: flush
        type:
          kind: number
        default: 0
        description: 1 if all five cards share a suit.
      - id: handScore
        type:
          kind: number
        default: 0
        description: Single comparable number; category and then tie-break ranks. Higher beats lower. 0 for players who never showed down.
      - id: isWinner
        type:
          kind: number
        default: 0
        description: 1 if the player holds the best showdown hand (ties all get 1).
