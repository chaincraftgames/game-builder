# ---------------------------------------------------------------------------
# Five-Card Draw Poker (one hand). Authored by an AI from a plain-language
# brief.
#
# Two to four players, one standard 52-card deck, 100 chips each, a 1-chip
# ante. Deal 5 cards each. There are two fixed-limit betting rounds (bet 2,
# then bet 4) separated by a draw. In each round a player may fold, check
# (when no bet is open), bet, call, or raise once by one bet size.
#
# Draw: each live player discards up to 3 cards and then draws back up to 5.
# Showdown: the best five-card hand wins the pot and ties split it. If
# everyone else folds, the last player takes the pot without showing. After
# the single hand, the player with the most chips wins.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - No wild cards, no blinds and no all-in handling.
#  - Hands are ranked by one computed score, since the engine has no
#    hand-ranking primitive.
#  - Folded players take a no-op action so that no turn has zero legal
#    actions.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: fold
      label: Fold
      description: Give up your hand and your claim on the pot.
      preconditions: not actor.property.folded and game.property.live > 1
      steps:
        - effect: set-state
          path: player.property.folded
          value: true
        - effect: set-state
          path: game.property.live
          value:
            delta: -1
        - effect: set-state
          path: player.property.acted
          value: true
    - id: check
      label: Check
      description: Pass without betting. Only when no bet is open.
      preconditions: not actor.property.folded and game.property.live > 1 and game.property.currentBet == 0
      steps:
        - effect: set-state
          path: player.property.acted
          value: true
    - id: bet
      label: Bet
      description: Open the betting with the fixed bet size.
      preconditions: not actor.property.folded and game.property.live > 1 and game.property.currentBet == 0
      steps:
        - effect: set-state
          path: player.property.chips
          value:
            delta:
              var: game.property.betSize
              negate: true
        - effect: set-state
          path: game.property.pot
          value:
            delta:
              var: game.property.betSize
        - effect: set-state
          path: game.property.currentBet
          value:
            var: game.property.betSize
        - effect: set-state
          path: player.property.roundBet
          value:
            var: game.property.betSize
        - effect: set-state
          path: player.property.acted
          value: true
    - id: call
      label: Call
      description: Match the open bet.
      preconditions: not actor.property.folded and game.property.live > 1 and game.property.currentBet > actor.property.roundBet
      steps:
        - effect: set-state
          path: player.property.chips
          value:
            delta:
              expr: actor.property.roundBet - game.property.currentBet
        - effect: set-state
          path: game.property.pot
          value:
            delta:
              expr: game.property.currentBet - actor.property.roundBet
        - effect: set-state
          path: player.property.roundBet
          value:
            var: game.property.currentBet
        - effect: set-state
          path: player.property.acted
          value: true
    - id: raise
      label: Raise
      description: Match the open bet and add one more bet size. One raise per round.
      preconditions: not actor.property.folded and game.property.live > 1 and game.property.currentBet > 0 and not game.property.raised
      steps:
        - effect: set-state
          path: player.property.chips
          value:
            delta:
              expr: actor.property.roundBet - game.property.currentBet - game.property.betSize
        - effect: set-state
          path: game.property.pot
          value:
            delta:
              expr: game.property.currentBet + game.property.betSize - actor.property.roundBet
        - effect: set-state
          path: game.property.currentBet
          value:
            delta:
              var: game.property.betSize
        - effect: set-state
          path: player.property.roundBet
          value:
            var: game.property.currentBet
        - effect: set-state
          path: game.property.raised
          value: true
        - effect: set-state
          path: player.property.acted
          value: true
    - id: sitOut
      label: Sit out
      description: 'Nothing to do: you have folded or only one player remains.'
      preconditions: actor.property.folded or game.property.live < 2
      steps:
        - effect: set-state
          path: player.property.acted
          value: true
    - id: discardCard
      label: Discard a card
      description: Discard one card from your hand (up to 3 per draw); replacements are dealt afterwards.
      preconditions: not actor.property.folded and game.property.live > 1
      steps:
        - input: card
          label: Card to discard
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            fromPlayer: actor
        - effect: move
          from:
            inventory: hand
            select:
              id:
                param: card
          to:
            inventory: discard
    - id: drawUp
      label: Draw replacements
      description: Draw cards from the deck until your hand is back to five.
      preconditions: not actor.property.folded and game.property.live > 1
      steps:
        - effect: move
          from:
            inventory: deck
            select: top
            count: 1
            filter: count(actor.inventory.hand) < 5
          to:
            inventory: hand
        - effect: move
          from:
            inventory: deck
            select: top
            count: 1
            filter: count(actor.inventory.hand) < 5
          to:
            inventory: hand
        - effect: move
          from:
            inventory: deck
            select: top
            count: 1
            filter: count(actor.inventory.hand) < 5
          to:
            inventory: hand
    - id: revealAndScore
      label: Show hand
      description: Score your hand and turn it face up at showdown.
      preconditions: not actor.property.folded and game.property.live > 1
      steps:
        - effectRef: scoreSig
        - effectRef: scoreRaw
        - effectRef: scoreTrip
        - effectRef: scorePair
        - effectRef: scoreFlush
        - effectRef: scoreStraight
        - effectRef: scoreTotal
        - effectRef: showHand
    - id: skipHand
      label: Stay hidden
      description: 'Folded, or everyone else folded: no showdown needed.'
      preconditions: actor.property.folded or game.property.live < 2
      steps:
        - effect: set-state
          path: player.property.acted
          value: true
    - id: markWinner
      label: Check for best hand
      description: Flag yourself as a winner if no remaining player has a higher hand score.
      preconditions: not actor.property.folded
      steps:
        - effect: set-state
          path: player.property.isWinner
          value:
            expr: if(all(players, player.property.handScore <= actor.property.handScore), 1, 0)
    - id: skipFolded
      label: Folded
      description: Folded players take no part.
      preconditions: actor.property.folded
      steps:
        - effect: set-state
          path: player.property.acted
          value: true
    - id: payWinner
      label: Collect winnings
      description: Take an equal share of the pot.
      preconditions: actor.property.isWinner == 1
      steps:
        - effect: set-state
          path: player.property.chips
          value:
            delta:
              expr: game.property.pot / count(players, player.property.isWinner == 1)
    - id: skipLoser
      label: Not a winner
      description: No winnings.
      preconditions: actor.property.isWinner == 0
      steps:
        - effect: set-state
          path: player.property.acted
          value: true
