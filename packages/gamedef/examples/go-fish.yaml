effects:
  effects:
    - id: fillDeck
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: deck
    - id: shuffleDeck
      effect: shuffle
      inventory: deck
    - id: dealCards
      effect: distribute
      from:
        inventory: deck
        select: top
      to:
        inventory: hand
      count: 7
    - id: resetExtraTurn
      effect: set-state
      path: game.property.extraTurn
      value: false
    - id: layBooks
      effect: move
      from:
        inventory: hand
        select: all
        filter: count(actor.inventory.hand, piece.property.rank == target.property.rank) == 4
      to:
        inventory: bookPile
    - id: countBooks
      effect: set-state
      path: player.property.books
      value:
        expr: count(actor.inventory.bookPile) / 4
    - id: drawOne
      effect: move
      from:
        inventory: deck
        select: top
        count: 1
      to:
        inventory: hand
flow:
  root:
    kind: game
    label: Go Fish
    hooks:
      onEnter:
        - effectRef: fillDeck
        - effectRef: shuffleDeck
        - effectRef: dealCards
    winConditions:
      - rule: ranking
        property: player.property.books
        order: highest
    children:
      - kind: turn
        id: openingBooks
        label: Set aside dealt books
        actor: all
        turnOrder:
          kind: seat
          direction: clockwise
        grammar:
          kind: action
          ref: layStartingBooks
      - kind: loop
        id: rounds
        label: Rounds
        endCondition: sum(players, player.property.books) == 13
        checkAfter: turn
        children:
          - kind: turn
            id: playerTurn
            label: Turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            hooks:
              onEnter:
                - effectRef: resetExtraTurn
            grammar:
              kind: repeat
              count:
                until: game.property.extraTurn == false or sum(players, player.property.books) == 13
                max: 60
              body:
                kind: sequence
                steps:
                  - kind: action
                    ref: drawWhenEmpty
                    optional: true
                  - kind: action
                    ref: ask
                  - kind: action
                    ref: goFish
                    optional: true
gamepieceTypes:
  types:
    - id: card
      category: card
      description: A standard playing card.
      properties:
        - id: rank
          label: Rank
          type:
            kind: number
            min: 1
            max: 13
          mutable: false
          visibility: always
        - id: suit
          label: Suit
          type:
            kind: enum
            values:
              - clubs
              - diamonds
              - hearts
              - spades
          mutable: false
          visibility: always
inventories:
  types:
    - id: deck
      label: Draw pile
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      countVisibility: always
      structure: stack
      displayHint: pile
      description: Face-down draw pile (the fish pond).
    - id: hand
      label: Hand
      scope:
        kind: player
      accepts:
        - card
      visibility: owner
      countVisibility: always
      displayHint: fan
      description: Each player's hidden hand; its size is public.
    - id: bookPile
      label: Books
      scope:
        kind: player
      accepts:
        - card
      visibility: always
      description: Completed books (four of a rank) set aside face up.
metadata:
  name: Go Fish
  playerCount:
    min: 2
    max: 2
state:
  game:
    properties:
      - id: extraTurn
        type:
          kind: boolean
        default: false
        description: True when the acting player earned another ask this turn (got cards, or fished the asked rank). The turn repeats until it is false.
      - id: askedRank
        type:
          kind: number
          min: 0
          max: 13
        default: 0
        description: Rank asked for in the current ask.
      - id: handBefore
        type:
          kind: number
          min: 0
          max: 52
        default: 0
        description: Size of the asker's hand just before the ask resolves, used to detect whether any cards were received.
      - id: askedCountBefore
        type:
          kind: number
          min: 0
          max: 4
        default: 0
        description: Cards of the asked rank the actor held just before fishing, used to detect whether the fished card matches.
  player:
    properties:
      - id: books
        type:
          kind: number
          min: 0
          max: 13
        default: 0
        description: Number of books (four of a rank) this player has set aside.
