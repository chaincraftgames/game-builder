# ---------------------------------------------------------------------------
# Go Fish. Authored by an AI from a plain-language brief.
#
# Two players, one standard 52-card deck. Deal 7 cards each; the rest is the
# draw pile. On your turn ask the other player for a rank you hold. If they
# hold any, they give you all cards of that rank and you ask again. If not,
# you go fish and draw one card; if it is the rank you asked for you go
# again, otherwise the turn passes.
#
# Four cards of one rank form a book and are set aside face up (books in the
# opening hand are set aside before play). A player with an empty hand draws
# a card before asking. The game ends when all 13 books are made and the
# player with the most books wins.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - The rank to ask for is chosen by picking a card in your own hand, which
#    enforces that you hold it.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: layStartingBooks
      label: Set aside books
      description: Set aside any book dealt in the opening hand.
      steps:
        - effectRef: layBooks
        - effectRef: countBooks
    - id: drawWhenEmpty
      label: Draw a card
      description: With an empty hand you draw one card from the pile before asking.
      preconditions: count(actor.inventory.hand) == 0 and count(game.inventory.deck) > 0
      steps:
        - effectRef: drawOne
        - effectRef: layBooks
        - effectRef: countBooks
    - id: ask
      label: Ask for a rank
      description: Pick a card in your hand to name its rank and ask the other player for every card of that rank.
      steps:
        - input: card
          label: Choose a card whose rank to ask for
          type:
            kind: gamepiece-select
            inventory: hand
            ofType: card
            fromPlayer: actor
        - effect: set-state
          path: game.property.askedRank
          value:
            expr: input.card.property.rank
        - effect: set-state
          path: game.property.handBefore
          value:
            expr: count(actor.inventory.hand)
        - effect: move
          from:
            player: all-other
            inventory: hand
            select: all
            filter: piece.property.rank == input.card.property.rank
          to:
            inventory: hand
        - effect: set-state
          path: game.property.extraTurn
          value:
            expr: count(actor.inventory.hand) > game.property.handBefore
        - effectRef: layBooks
        - effectRef: countBooks
    - id: goFish
      label: Go fish
      description: The other player had none, so draw one card; if it is the rank you asked for you go again.
      preconditions: game.property.extraTurn == false and count(game.inventory.deck) > 0
      steps:
        - effect: set-state
          path: game.property.askedCountBefore
          value:
            expr: count(actor.inventory.hand, piece.property.rank == game.property.askedRank)
        - effectRef: drawOne
        - effect: set-state
          path: game.property.extraTurn
          value:
            expr: count(actor.inventory.hand, piece.property.rank == game.property.askedRank) > game.property.askedCountBefore
        - effectRef: layBooks
        - effectRef: countBooks
