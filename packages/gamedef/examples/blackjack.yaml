# ---------------------------------------------------------------------------
# Blackjack (5 rounds). Authored by an AI from a plain-language brief.
#
# One to four players against an automated dealer, one standard 52-card deck,
# five rounds. Each round all cards are gathered and reshuffled, each player
# gets two cards and the dealer gets one up and one hole card. Players take
# turns to hit or stand until they stand or go over 21. Then the dealer
# reveals the hole card and draws until reaching 17 or more (the dealer
# stands on any 17, soft 17 included).
#
# A player wins the round if they have 21 or less and the dealer busts or the
# player's total is higher. Aces count 1 or 11. The player with the most
# round wins after five rounds wins and ties share the win.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - The dealer is not a player; it is driven by a proxy turn.
#  - No natural-blackjack bonus, doubling, splitting or betting.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: hit
      label: Hit
      description: Take another card from the deck.
      preconditions: not actor.property.standing and (actor.property.hardTotal + if(actor.property.aceCount > 0 and actor.property.hardTotal <= 11, 10, 0)) < 21
      steps:
        - effect: move
          from:
            inventory: deck
            select: top
            count: 1
          to:
            inventory: hand
    - id: stand
      label: Stand
      description: Keep your hand as it is for the rest of the round.
      steps:
        - effect: set-state
          path: player.property.standing
          value: true
    - id: dealerHit
      label: Dealer draws
      description: The dealer takes a card only while the hand totals under 17. The filter selects nothing once the dealer has 17 or more, so the action is then a no-op.
      steps:
        - effect: move
          from:
            inventory: deck
            select: top
            count: 1
            filter: (game.property.dealerHardTotal + if(game.property.dealerAceCount > 0 and game.property.dealerHardTotal <= 11, 10, 0)) < 17
          to:
            inventory: dealerHand
    - id: scoreRound
      label: Score round
      description: Runs automatically for each player. A player who did not bust beats the dealer when the dealer busts or the player's total is higher. Ties score nothing.
      steps:
        - effect: set-state
          path: player.property.wins
          value:
            expr: actor.property.wins + if((actor.property.hardTotal + if(actor.property.aceCount > 0 and actor.property.hardTotal <= 11, 10, 0)) <= 21 and ((game.property.dealerHardTotal + if(game.property.dealerAceCount > 0 and game.property.dealerHardTotal <= 11, 10, 0)) > 21 or (actor.property.hardTotal + if(actor.property.aceCount > 0 and actor.property.hardTotal <= 11, 10, 0)) > (game.property.dealerHardTotal + if(game.property.dealerAceCount > 0 and game.property.dealerHardTotal <= 11, 10, 0))), 1, 0)
