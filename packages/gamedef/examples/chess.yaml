# ---------------------------------------------------------------------------
# Chess (without check rules). Authored by an AI from a plain-language brief.
#
# Two players, standard chess. White is player 1 and moves first. All piece
# moves are implemented, including castling, en passant and promotion (the
# mover chooses the piece), plus resignation. A game is drawn automatically
# by insufficient material (king against king, or king and one minor piece
# against king), by threefold repetition, or by the fifty-move rule.
#
# The spec below is the authored spec, with one description sentence
# shortened to drop a pointer to a lab file; no rules changed.
#
# Known limits:
#  - Check is NOT enforced: a move may leave or put your own king in check,
#    and pins and forced replies to check do not exist.
#  - Castling requires an unmoved king and rook and empty squares between
#    them, but does not test attacked squares.
#  - Checkmate and stalemate cannot be detected, so the game is won by
#    capturing the enemy king.
#  - These need an engine change: nestable aggregators, an attack-on-square
#    test, or a has-legal-action predicate for end conditions.
#  - The repetition fingerprint is a hash and is not an exact position key.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: movePiece
      label: Move a piece
      description: 'Move one of your pieces. Includes castling (king moves two squares), en passant and promotion. Legality is pseudo-legal.'
      steps:
        - input: piece
          label: Piece to move
          type:
            kind: gamepiece-select
            inventory: board
            ofType: piece
            filter: piece.property.side == game.property.turnSide
        - input: toFile
          label: Destination file (1=a ... 8=h)
          type:
            kind: number
            min: 1
            max: 8
        - input: toRank
          label: Destination rank (1-8)
          type:
            kind: number
            min: 1
            max: 8
          validation: (input.toFile != input.piece.property.file or input.toRank != input.piece.property.rank) and count(game.inventory.board, piece.property.file == input.toFile and piece.property.rank == input.toRank and piece.property.side == game.property.turnSide) == 0 and ((input.piece.property.kind == "N" and (input.toFile - input.piece.property.file) * (input.toFile - input.piece.property.file) + (input.toRank - input.piece.property.rank) * (input.toRank - input.piece.property.rank) == 5) or ((input.piece.property.kind == "B" or input.piece.property.kind == "Q") and (input.toFile - input.piece.property.file) * (input.toFile - input.piece.property.file) == (input.toRank - input.piece.property.rank) * (input.toRank - input.piece.property.rank) and count(game.inventory.board, (piece.property.file - input.piece.property.file) * (input.toRank - input.piece.property.rank) == (piece.property.rank - input.piece.property.rank) * (input.toFile - input.piece.property.file) and (piece.property.file - input.piece.property.file) * (piece.property.file - input.toFile) <= 0 and (piece.property.rank - input.piece.property.rank) * (piece.property.rank - input.toRank) <= 0 and (piece.property.file != input.piece.property.file or piece.property.rank != input.piece.property.rank) and (piece.property.file != input.toFile or piece.property.rank != input.toRank)) == 0) or ((input.piece.property.kind == "R" or input.piece.property.kind == "Q") and (input.toFile == input.piece.property.file or input.toRank == input.piece.property.rank) and count(game.inventory.board, (piece.property.file - input.piece.property.file) * (input.toRank - input.piece.property.rank) == (piece.property.rank - input.piece.property.rank) * (input.toFile - input.piece.property.file) and (piece.property.file - input.piece.property.file) * (piece.property.file - input.toFile) <= 0 and (piece.property.rank - input.piece.property.rank) * (piece.property.rank - input.toRank) <= 0 and (piece.property.file != input.piece.property.file or piece.property.rank != input.piece.property.rank) and (piece.property.file != input.toFile or piece.property.rank != input.toRank)) == 0) or (input.piece.property.kind == "K" and (((input.toFile - input.piece.property.file) * (input.toFile - input.piece.property.file) <= 1 and (input.toRank - input.piece.property.rank) * (input.toRank - input.piece.property.rank) <= 1) or (input.toRank == input.piece.property.rank and ((input.toFile - input.piece.property.file) == 2 or (input.toFile - input.piece.property.file) == -2) and input.piece.property.moved == 0 and count(game.inventory.board, piece.property.kind == "R" and piece.property.side == game.property.turnSide and piece.property.moved == 0 and piece.property.rank == input.piece.property.rank and piece.property.file == if(input.toFile > input.piece.property.file, 8, 1)) == 1 and count(game.inventory.board, piece.property.rank == input.piece.property.rank and ((input.toFile > input.piece.property.file and piece.property.file > input.piece.property.file and piece.property.file < 8) or (input.toFile < input.piece.property.file and piece.property.file < input.piece.property.file and piece.property.file > 1))) == 0))) or (input.piece.property.kind == "P" and ((input.toFile == input.piece.property.file and (input.toRank - input.piece.property.rank) == if(game.property.turnSide == 1, 1, -1) and count(game.inventory.board, piece.property.file == input.toFile and piece.property.rank == input.toRank) == 0) or (input.toFile == input.piece.property.file and (input.toRank - input.piece.property.rank) == if(game.property.turnSide == 1, 2, -2) and input.piece.property.rank == if(game.property.turnSide == 1, 2, 7) and count(game.inventory.board, piece.property.file == input.toFile and piece.property.rank == input.toRank) == 0 and count(game.inventory.board, piece.property.file == input.piece.property.file and piece.property.rank == input.piece.property.rank + if(game.property.turnSide == 1, 1, -1)) == 0) or ((input.toFile - input.piece.property.file) * (input.toFile - input.piece.property.file) == 1 and (input.toRank - input.piece.property.rank) == if(game.property.turnSide == 1, 1, -1) and (count(game.inventory.board, piece.property.file == input.toFile and piece.property.rank == input.toRank and piece.property.side != game.property.turnSide) == 1 or (input.toFile == game.property.epFile and input.toRank == game.property.epRank))))))
          validationMessage: That piece cannot move there.
        - input: promo
          label: Promote to (Q, R, B, N; - if not promoting)
          type:
            kind: enum
            values:
              - '-'
              - Q
              - R
              - B
              - 'N'
          validation: ((input.piece.property.kind == "P" and input.toRank == if(game.property.turnSide == 1, 8, 1)) and input.promo != "-") or (not (input.piece.property.kind == "P" and input.toRank == if(game.property.turnSide == 1, 8, 1)) and input.promo == "-")
          validationMessage: Choose a promotion piece only when a pawn reaches the last rank.
        - effect: set-state
          path: game.property.halfmove
          value:
            expr: if(input.piece.property.kind == "P" or count(game.inventory.board, piece.property.file == input.toFile and piece.property.rank == input.toRank) > 0, 0, game.property.halfmove + 1)
        - effect: move
          from:
            inventory: board
            select: all
            ofType: piece
            filter: piece.property.file == input.toFile and piece.property.rank == input.toRank and piece.property.side != game.property.turnSide
          to:
            inventory: captured
        - effect: move
          from:
            inventory: board
            select: all
            ofType: piece
            filter: input.piece.property.kind == "P" and input.toFile == game.property.epFile and input.toRank == game.property.epRank and input.piece.property.file != input.toFile and piece.property.side != game.property.turnSide and piece.property.file == input.toFile and piece.property.rank == input.piece.property.rank
          to:
            inventory: captured
        - effect: update
          pieces:
            inventory: board
            select: all
            ofType: piece
            filter: input.piece.property.kind == "K" and input.toFile - input.piece.property.file == 2 and piece.property.kind == "R" and piece.property.side == game.property.turnSide and piece.property.file == 8 and piece.property.rank == input.piece.property.rank
          property: file
          value: 6
        - effect: update
          pieces:
            inventory: board
            select: all
            ofType: piece
            filter: input.piece.property.kind == "K" and input.toFile - input.piece.property.file == -2 and piece.property.kind == "R" and piece.property.side == game.property.turnSide and piece.property.file == 1 and piece.property.rank == input.piece.property.rank
          property: file
          value: 4
        - effect: set-state
          path: game.property.epFile
          value:
            expr: if(input.piece.property.kind == "P" and (input.toRank - input.piece.property.rank == 2 or input.toRank - input.piece.property.rank == -2), input.toFile, 0)
        - effect: set-state
          path: game.property.epRank
          value:
            expr: if(input.piece.property.kind == "P" and (input.toRank - input.piece.property.rank == 2 or input.toRank - input.piece.property.rank == -2), (input.toRank + input.piece.property.rank) / 2, 0)
        - effect: update
          pieces:
            inventory: board
            select:
              id:
                param: piece
          property: file
          value:
            param: toFile
        - effect: update
          pieces:
            inventory: board
            select:
              id:
                param: piece
          property: rank
          value:
            param: toRank
        - effect: update
          pieces:
            inventory: board
            select:
              id:
                param: piece
          property: moved
          value: 1
        - effect: update
          pieces:
            inventory: board
            select:
              id:
                param: piece
            filter: input.promo != "-"
          property: kind
          value:
            param: promo
        - effect: update
          pieces:
            inventory: board
            select:
              id:
                param: piece
            filter: input.promo != "-"
          property: hv
          value:
            expr: (game.property.turnSide - 1) * 6 + if(input.promo == "Q", 5, if(input.promo == "R", 4, if(input.promo == "B", 3, 2)))
        - effect: set-state
          path: player.property.won
          value:
            expr: count(game.inventory.board, piece.property.kind == "K") < 2
        - effect: set-state
          path: game.property.turnSide
          value:
            expr: 3 - game.property.turnSide
        - effectRef: computeHash
        - effectRef: clearHistory
        - effectRef: addHistory
        - effectRef: writeHistory
        - effectRef: computeOver
    - id: resign
      label: Resign
      description: Concede the game; the opponent wins.
      steps:
        - effect: set-state
          path: player.property.won
          value: true
          target: all-other
        - effect: set-state
          path: game.property.over
          value: true
