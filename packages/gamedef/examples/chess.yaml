effects:
  effects:
    - id: setupBoard
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: piece
      to:
        inventory: board
    - id: computeHash
      effect: set-state
      path: game.property.curHash
      value:
        expr: sum(game.inventory.board, ((piece.property.hv + 13 * piece.property.moved) * 100 + piece.property.file * 10 + piece.property.rank) * ((piece.property.hv + 13 * piece.property.moved) * 100 + piece.property.file * 10 + piece.property.rank) * ((piece.property.hv + 13 * piece.property.moved) * 100 + piece.property.file * 10 + piece.property.rank)) + game.property.epFile * 1000003 + game.property.turnSide * 7000001
    - id: clearHistory
      effect: move
      from:
        inventory: history
        select: all
        ofType: histmark
        filter: game.property.halfmove == 0
      to:
        inventory: game:unassigned
    - id: addHistory
      effect: move
      from:
        inventory: game:unassigned
        select: top
        count: 1
        ofType: histmark
      to:
        inventory: history
    - id: writeHistory
      effect: update
      pieces:
        inventory: history
        select: all
        ofType: histmark
        filter: piece.property.hash == 0
      property: hash
      value:
        var: game.property.curHash
    - id: computeOver
      effect: set-state
      path: game.property.over
      value:
        expr: count(game.inventory.board, piece.property.kind == "K") < 2 or game.property.halfmove >= 100 or count(game.inventory.history, piece.property.hash == game.property.curHash) >= 3 or (count(game.inventory.board, piece.property.kind == "P" or piece.property.kind == "R" or piece.property.kind == "Q") == 0 and count(game.inventory.board, piece.property.kind == "N" or piece.property.kind == "B") <= 1)
flow:
  root:
    kind: game
    label: Chess
    hooks:
      onEnter:
        - effectRef: setupBoard
        - effectRef: computeHash
        - effectRef: addHistory
        - effectRef: writeHistory
    winConditions:
      - rule: condition
        condition: player.property.won == true
    children:
      - kind: loop
        id: plies
        label: Moves
        endCondition: game.property.over == true
        checkAfter: turn
        children:
          - kind: turn
            id: ply
            label: Move
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: choice
              options:
                - kind: action
                  ref: movePiece
                - kind: action
                  ref: resign
gamepieceTypes:
  types:
    - id: piece
      category: token
      description: A chess piece. Its square is held in the file and rank properties (1-8; file 1 = a, rank 1 = white's back rank).
      properties:
        - id: kind
          type:
            kind: string
          mutable: true
          visibility: always
          description: P, N, B, R, Q or K. Changes when a pawn promotes.
        - id: side
          type:
            kind: number
            min: 1
            max: 2
          mutable: false
          visibility: always
          description: 1 = white, 2 = black.
        - id: file
          type:
            kind: number
            min: 1
            max: 8
          mutable: true
          visibility: always
        - id: rank
          type:
            kind: number
            min: 1
            max: 8
          mutable: true
          visibility: always
        - id: moved
          type:
            kind: number
            min: 0
            max: 1
          mutable: true
          default: 0
          visibility: always
          description: 1 once the piece has moved; governs castling and the pawn double step.
        - id: hv
          type:
            kind: number
            min: 1
            max: 12
          mutable: true
          visibility: always
          description: Numeric piece code (side and kind) used only in the position fingerprint.
    - id: histmark
      category: token
      description: One recorded position for repetition counting.
      properties:
        - id: hash
          type:
            kind: number
            min: 0
          mutable: true
          default: 0
          visibility: always
          description: Fingerprint of the recorded position; 0 means not yet written.
inventories:
  types:
    - id: board
      label: Board
      scope:
        kind: game
      accepts:
        - piece
      visibility: always
      description: Pieces in play. A piece's square is its file and rank properties.
    - id: captured
      label: Captured
      scope:
        kind: game
      accepts:
        - piece
      visibility: always
      description: Captured pieces.
    - id: history
      label: Position history
      scope:
        kind: game
      accepts:
        - histmark
      visibility: always
      description: One token per position since the last capture or pawn move.
metadata:
  name: Chess
  playerCount:
    min: 2
    max: 2
state:
  game:
    properties:
      - id: turnSide
        type:
          kind: number
          min: 1
          max: 2
        default: 1
        description: 'Side to move: 1 = white (player 1), 2 = black (player 2). Toggled after every move.'
      - id: epFile
        type:
          kind: number
          min: 0
          max: 8
        default: 0
        description: File of the en passant target square, 0 when none. Set only by a pawn double step.
      - id: epRank
        type:
          kind: number
          min: 0
          max: 8
        default: 0
        description: Rank of the en passant target square, 0 when none.
      - id: halfmove
        type:
          kind: number
          min: 0
        default: 0
        description: Plies since the last capture or pawn move; 100 ends the game as a draw.
      - id: curHash
        type:
          kind: number
          min: 0
        default: 0
        description: Position fingerprint (piece placement, moved flags, en passant file, side to move) used for repetition counting.
      - id: over
        type:
          kind: boolean
        default: false
        description: True once the game is decided or drawn; ends the move loop.
  player:
    properties:
      - id: won
        type:
          kind: boolean
        default: false
        description: True for the winner. If the game ends with nobody having won, it is a draw.
