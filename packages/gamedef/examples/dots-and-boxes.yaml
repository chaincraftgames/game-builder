effects:
  effects:
    - id: placeEdges
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: edge
      to:
        inventory: undrawn
    - id: placeBoxes
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: box
      to:
        inventory: boxes
flow:
  root:
    kind: game
    label: Dots and Boxes
    hooks:
      onEnter:
        - effectRef: placeEdges
        - effectRef: placeBoxes
    winConditions:
      - rule: ranking
        property: player.property.score
        order: highest
    children:
      - kind: loop
        id: rounds
        label: Turns
        endCondition: count(game.inventory.undrawn) == 0
        checkAfter: turn
        children:
          - kind: turn
            id: playerTurn
            label: Draw edges
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: repeat
              count:
                until: game.property.capturedNow == 0 or count(game.inventory.undrawn) == 0
              body:
                kind: action
                ref: drawEdge
gamepieceTypes:
  types:
    - id: edge
      category: token
      description: One of the 24 line segments between neighbouring dots.
      properties:
        - id: boxA
          label: Box A
          type:
            kind: number
            min: 0
            max: 9
          mutable: false
          visibility: always
          description: Index (1-9, row-major) of one box this edge borders; 0 if none.
        - id: boxB
          label: Box B
          type:
            kind: number
            min: 0
            max: 9
          mutable: false
          visibility: always
          description: Index (1-9, row-major) of the other box this edge borders; 0 if none.
    - id: box
      category: token
      description: One of the 9 boxes of the 3x3 grid.
      properties:
        - id: index
          label: Index
          type:
            kind: number
            min: 1
            max: 9
          mutable: false
          visibility: always
          description: Box number 1-9, row-major from the top-left.
        - id: sides
          label: Sides drawn
          type:
            kind: number
            min: 0
            max: 4
          mutable: true
          source: runtime
          default: 0
          visibility: always
        - id: owner
          label: Captured by
          type:
            kind: string
          mutable: true
          source: runtime
          default: ''
          visibility: always
          description: Id of the player who captured the box; empty while uncaptured.
inventories:
  types:
    - id: undrawn
      label: Undrawn edges
      scope:
        kind: game
      accepts:
        - edge
      visibility: always
    - id: drawn
      label: Drawn edges
      scope:
        kind: game
      accepts:
        - edge
      visibility: always
    - id: boxes
      label: Boxes
      scope:
        kind: game
      accepts:
        - box
      visibility: always
metadata:
  name: Dots and Boxes
  playerCount:
    min: 2
    max: 2
state:
  game:
    properties:
      - id: capturedNow
        type:
          kind: number
          min: 0
          max: 2
        default: 0
        description: Boxes completed by the edge just drawn (0, 1 or 2). Written by drawEdge, read by the turn's repeat to decide whether the same player draws again, and added to the actor's score.
  player:
    properties:
      - id: score
        type:
          kind: number
          min: 0
          max: 9
        default: 0
        description: Number of boxes this player has captured.
