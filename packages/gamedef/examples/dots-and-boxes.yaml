# ---------------------------------------------------------------------------
# Dots and Boxes (3x3 boxes). Authored by an AI from a plain-language brief.
#
# Two players on a 3x3 grid of boxes (4x4 dots, 24 edges). Players alternate
# drawing one undrawn edge. Completing the fourth side of a box, or of two
# boxes at once, captures it for the player who drew the edge and gives that
# player another turn; otherwise the turn passes. The game ends when all 24
# edges are drawn and the player with more boxes wins (9 boxes, so no ties).
# Player 1 goes first.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - Capture detection uses a side counter on each box rather than geometry.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: drawEdge
      label: Draw an edge
      description: Draw one undrawn edge. Each box it borders gains a side; boxes that now have four sides are captured by the actor, who then moves again.
      steps:
        - input: edge
          label: Choose an edge to draw
          type:
            kind: gamepiece-select
            inventory: undrawn
            ofType: edge
        - effect: move
          from:
            inventory: undrawn
            select:
              id:
                param: edge
          to:
            inventory: drawn
        - effect: update
          pieces:
            inventory: boxes
            select: all
            filter: piece.property.index == input.edge.property.boxA or piece.property.index == input.edge.property.boxB
          property: sides
          value:
            delta: 1
        - effect: set-state
          path: game.property.capturedNow
          value:
            expr: count(game.inventory.boxes, piece.property.sides == 4 and piece.property.owner == "")
        - effect: set-state
          path: player.property.score
          value:
            delta:
              var: game.property.capturedNow
        - effect: update
          pieces:
            inventory: boxes
            select: all
            filter: piece.property.sides == 4 and piece.property.owner == ""
          property: owner
          value:
            actor: true
