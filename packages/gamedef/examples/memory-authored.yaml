effects:
  effects:
    - id: fillDeck
      effect: move
      from:
        inventory: game:unassigned
        select: all
        ofType: card
      to:
        inventory: deck
    - id: shuffleDeck
      effect: shuffle
      inventory: deck
    - id: layOutGrid
      effect: move
      from:
        inventory: deck
        select: all
      to:
        inventory: grid
    - id: turnAllFaceDown
      effect: flip
      pieces:
        inventory: grid
        select: all
      to: face-down
    - id: announceStart
      effect: message
      to: all
      template: 16 cards are face down in a 4 by 4 grid. Find the pairs!
flow:
  root:
    kind: game
    label: Memory
    hooks:
      onEnter:
        - effectRef: fillDeck
        - effectRef: shuffleDeck
        - effectRef: layOutGrid
        - effectRef: turnAllFaceDown
        - effectRef: announceStart
    winConditions:
      - rule: ranking
        property: player.property.score
        order: highest
        tiebreak: all-win
    children:
      - kind: loop
        id: rounds
        label: Rounds
        endCondition: count(game.inventory.grid) == 0
        checkAfter: turn
        children:
          - kind: turn
            id: playerTurn
            label: Player turn
            actor: all
            turnOrder:
              kind: seat
              direction: clockwise
            grammar:
              kind: repeat
              count:
                until: game.property.matched == false or count(game.inventory.grid) == 0
              body:
                kind: sequence
                steps:
                  - kind: action
                    ref: flipFirst
                  - kind: action
                    ref: flipSecond
                  - kind: action
                    ref: takePair
                    optional: true
                  - kind: action
                    ref: hideCards
                    optional: true
gamepieceTypes:
  types:
    - id: card
      category: card
      hasFaceState: true
      description: A memory card. Two cards share each picture.
      properties:
        - id: picture
          label: Picture
          type:
            kind: string
          mutable: false
          visibility: revealed
          description: The picture on the card; visible only while the card is face up.
inventories:
  types:
    - id: deck
      label: Deck
      scope:
        kind: game
      accepts:
        - card
      visibility: never
      structure: stack
      description: Setup only. Holds the cards while they are shuffled before being laid out in the grid.
    - id: grid
      label: Grid
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      structure: grid
      gridDimensions:
        rows: 4
        columns: 4
      description: The 4 by 4 layout. Pictures show only on face-up cards, so nobody sees a face-down card.
    - id: taken
      label: Taken pairs
      scope:
        kind: game
      accepts:
        - card
      visibility: always
      description: Matched pairs removed from the grid.
metadata:
  name: Memory
  playerCount:
    min: 2
    max: 2
state:
  game:
    properties:
      - id: firstPicture
        type:
          kind: string
        default: ''
        description: Picture on the first card turned up this turn. Written by flipFirst and compared by flipSecond.
      - id: matched
        type:
          kind: boolean
        default: false
        description: True when the two cards turned up this turn show the same picture. Written by flipSecond, read by the resolve actions and the extra-turn repeat.
  player:
    properties:
      - id: score
        type:
          kind: number
          min: 0
          max: 8
        default: 0
        description: Number of pairs this player has taken.
