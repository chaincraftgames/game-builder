# ---------------------------------------------------------------------------
# Memory (authored variant). Authored by an AI from a plain-language brief.
#
# Two players, 16 cards (8 pictures, 2 of each) shuffled face down in a 4x4
# grid. Player 1 goes first. On a turn turn up one face-down card, then a
# different one; both are visible to both players. A match is taken from the
# grid, scores 1 point and gives another turn. A mismatch turns both cards
# face down in place and passes the turn.
#
# The game ends when the grid is empty. The player with more points wins and
# 4-4 is a draw.
#
# The spec below is the authored spec unchanged; only this header was added.
#
# Known limits:
#  - Card ids are neutral (c01 to c16) so ids do not reveal pictures.
# ---------------------------------------------------------------------------

actions:
  actions:
    - id: flipFirst
      label: Turn up the first card
      description: Turn one face-down card face up.
      steps:
        - input: card
          label: Choose a face-down card
          type:
            kind: gamepiece-select
            inventory: grid
            ofType: card
            filter: piece.faceUp == false
        - effect: flip
          pieces:
            inventory: grid
            select:
              id:
                param: card
          to: face-up
        - effect: set-state
          source:
            param: card
          path: game.property.firstPicture
          value:
            var: source.property.picture
    - id: flipSecond
      label: Turn up a second card
      description: Turn a different face-down card face up and record whether it matches the first.
      steps:
        - input: card
          label: Choose a different face-down card
          type:
            kind: gamepiece-select
            inventory: grid
            ofType: card
            filter: piece.faceUp == false
        - effect: flip
          pieces:
            inventory: grid
            select:
              id:
                param: card
          to: face-up
        - effect: set-state
          path: game.property.matched
          value:
            expr: count(game.inventory.grid, piece.faceUp == true and piece.property.picture == game.property.firstPicture) == 2
    - id: takePair
      label: Take the pair
      description: The two face-up cards match. Remove them from the grid and score a point.
      preconditions: game.property.matched == true
      steps:
        - effect: move
          from:
            inventory: grid
            select: all
            filter: piece.faceUp == true
          to:
            inventory: taken
        - effect: set-state
          path: player.property.score
          value:
            delta: 1
    - id: hideCards
      label: Turn the cards back down
      description: The two face-up cards do not match. They go face down again in the same places.
      preconditions: game.property.matched == false
      steps:
        - effect: flip
          pieces:
            inventory: grid
            select: all
            filter: piece.faceUp == true
          to: face-down
