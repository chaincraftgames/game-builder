metadata:
  name: "Liar's Dice"
  playerCount:
    min: 2
    max: 6

state:
  game:
    properties:
      - id: currentBidQuantity
        type:
          kind: number
          min: 0
          max: 30
        default: 0
        description: Quantity of dice declared in the current round's bid. 0 = no bid yet.
      - id: currentBidFace
        type:
          kind: number
          min: 0
          max: 6
        default: 0
        description: Face value declared in the current round's bid. 0 = no bid yet.
      - id: currentBidder
        type:
          kind: string
        default: ""
        description: Player ID of the player who made the current bid. Empty string = no bid yet.
      - id: challengeMade
        type:
          kind: boolean
        default: false
        description: >-
          Set to true when a player challenges the current bid. Exits the
          bidding loop and advances to the review turn.
      - id: roundLoser
        type:
          kind: string
        default: ""
        description: >-
          Player ID of the loser of the most recent challenge. Set by
          resolveChallenge; used by eliminateDie to remove the correct die.
          Kept between rounds: the loser (or the next seat if eliminated)
          starts the next round. Empty before the first challenge = seat 1.

gamepieceTypes:
  types:
    - id: die
      category: dice
      description: A six-sided die kept hidden under each player's cup.
      properties:
        - id: face
          label: Face
          type:
            kind: number
            min: 1
            max: 6
          mutable: true
          visibility: always
          description: >-
            The face currently showing. The playerCup inventory's owner
            visibility controls who can see dice inside it.

inventories:
  types:
    - id: playerCup
      scope:
        kind: player
      accepts:
        - die
      visibility: owner
      description: >-
        Each player's hidden cup. Dice here are visible only to the owning
        player.

effects:
  effects:
    - id: dealDice
      kind: distribute
      from:
        inventory: "game:unassigned"
        select: top
        ofType: die
      to:
        scope: all-players
        inventory: playerCup
      count: 5

    - id: rollAllDice
      kind: roll
      pieces:
        inventory: playerCup
        select: all

    - id: revealAllDice
      kind: reveal
      pieces:
        inventory: playerCup
        select: all
      to: all

    - id: hideAllDice
      kind: hide
      pieces:
        inventory: playerCup
        select: all

    - id: resetBid
      kind: set-state
      path: game.property.currentBidQuantity
      value: 0

    - id: resetBidFace
      kind: set-state
      path: game.property.currentBidFace
      value: 0

    - id: resetBidder
      kind: set-state
      path: game.property.currentBidder
      value: ""

    - id: resetChallengeMade
      kind: set-state
      path: game.property.challengeMade
      value: false

    - id: setChallengeMade
      kind: set-state
      path: game.property.challengeMade
      value: true

    - id: resolveChallenge
      kind: custom
      description: >-
        Count all dice across every player's playerCup where face equals
        game.property.currentBidFace. If the total count is greater than or
        equal to game.property.currentBidQuantity, the challenge fails — set
        game.property.roundLoser to the challenger's player ID. If the total
        is less, the challenge succeeds — set game.property.roundLoser to the
        value of game.property.currentBidder.

    - id: eliminateDie
      kind: move
      from:
        player:
          stateRef: game.property.roundLoser
        inventory: playerCup
        select: random
        count: 1
      to:
        inventory: "game:unassigned"

    - id: checkElimination
      kind: set-state
      path: player.property.eliminated
      value: true
      target:
        kind: matching
        condition: "count(player.inventory.playerCup) == 0"

actions:
  actions:
    - id: makeBid
      label: Make Bid
      description: >-
        Declare how many dice across all players show a given face value.
        Must be strictly higher than the previous bid.
      inputs:
        - id: quantity
          label: Quantity
          type:
            kind: number
            min: 1
            max: 30
        - id: faceValue
          label: Face Value
          type:
            kind: number
            min: 1
            max: 6
          validation: >-
            input.quantity > game.property.currentBidQuantity or
            (input.quantity == game.property.currentBidQuantity and
            input.faceValue > game.property.currentBidFace)
          validationMessage: >-
            Bid a higher quantity, or the same quantity with a higher face value.
      effects:
        - kind: set-state
          path: game.property.currentBidQuantity
          value:
            param: quantity
        - kind: set-state
          path: game.property.currentBidFace
          value:
            param: faceValue
        - kind: set-state
          path: game.property.currentBidder
          value:
            actor: true
        - kind: message
          to: all
          template: >-
            {{actor.name}} bids {{input.quantity}} dice showing
            {{input.faceValue}}s.

    - id: challenge
      label: Challenge
      description: >-
        Call out the current bid as a lie. Reveals all dice to all players,
        resolves the round, then waits for a player to start the next round.
      preconditions: "game.property.currentBidQuantity != 0"
      effects:
        - ref: revealAllDice
        - ref: resolveChallenge
        - ref: eliminateDie
        - ref: checkElimination
        - ref: setChallengeMade
        - kind: message
          to: all
          template: >-
            {{actor.name}} challenges the bid of
            {{state.game.property.currentBidQuantity}}
            {{state.game.property.currentBidFace}}s — all dice are now
            revealed. Type "start next round" when you're ready to continue.

    - id: startNextRound
      label: Start Next Round
      description: >-
        Hide the dice, roll for the next round, and reset the bid. Use
        this after reviewing the results of a challenge.
      effects:
        - ref: hideAllDice
        - ref: rollAllDice
        - ref: resetBid
        - ref: resetBidFace
        - ref: resetBidder
        - ref: resetChallengeMade

flow:
  root:
    kind: game
    hooks:
      onEnter:
        - ref: dealDice        # once at game start — dice stay in cups all game
        - ref: rollAllDice    # initial roll before the first round
    winConditions:
      - rule: condition
        condition: "not player.property.eliminated"
        onVictory:
          - kind: message
            to: all
            template: "{{game.winners[0]}} wins Liar's Dice — the last player with dice remaining!"
    children:
      - kind: loop              # game loop — runs until one player remains
        endCondition: "countPlayers(not player.property.eliminated) <= 1"
        children:
          - kind: loop          # bidding loop — players bid until someone challenges
            endCondition: "game.property.challengeMade == true"
            checkAfter: "turn"
            children:
              - kind: turn
                actor: all-players
                turnOrder:
                  kind: seat
                  direction: clockwise
                  startingPlayer: { stateRef: game.property.roundLoser }
                grammar:
                  kind: choice
                  options:
                    - kind: action
                      ref: makeBid
                    - kind: action
                      ref: challenge
          - kind: turn          # review turn — the round loser (or next live seat) starts the next round
            actor: { player: { stateRef: game.property.roundLoser } }
            grammar:
              kind: action
              ref: startNextRound

catalog:
  entries:
    - typeId: die
      quantity: 30
